<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innovex — Subcontrataciones</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root{
    --bg:#F5F4EF; --surface:#FFFFFF; --surface-alt:#EFEEE6; --border:#DEDCD1;
    --ink:#1B2321; --ink-muted:#5C665F; --accent:#1B4B43; --accent-hover:#143A34;
    --accent-warm:#A6692E; --accent-warm-bg:#F3E6D6;
    --st-proceso:#6B7563;  --st-proceso-bg:#EEF0EC;
    --st-transito:#2E5C8A; --st-transito-bg:#E7EEF5;
    --st-aduana:#A6761D;   --st-aduana-bg:#F5EEDD;
    --st-destino:#1B4B43;  --st-destino-bg:#E4EEEC;
    --st-recibido:#2F6B3A; --st-recibido-bg:#E7F0E8;
    --st-atrasado:#A6332F; --st-atrasado-bg:#F6E5E4;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  #app{min-height:100vh;}
  .center-loading{ display:flex;align-items:center;justify-content:center;height:100vh; color:var(--ink-muted); font-family:var(--font-display); font-size:18px; }
  .login-box{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:36px 34px; width:100%; max-width:380px; text-align:left; }

  .topbar{ padding:24px 40px 0; border-bottom:1px solid var(--border); background:var(--surface); }
  .topbar-inner{ display:flex; flex-direction:column; gap:16px; max-width:1280px; margin:0 auto; padding-bottom:18px; }
  .topbar-row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; }
  .account-menu-wrap{ position:relative; }
  .account-menu-btn{ font-size:18px; line-height:1; padding:6px 10px; }
  .account-menu-dropdown{ position:absolute; top:calc(100% + 6px); right:0; background:var(--surface); border:1px solid var(--border); border-radius:6px; box-shadow:0 8px 20px rgba(0,0,0,0.12); min-width:190px; padding:6px; z-index:30; display:flex; flex-direction:column; }
  .account-menu-item{ display:block; width:100%; text-align:left; background:none; border:none; padding:9px 12px; font-size:13.5px; color:var(--ink); border-radius:4px; cursor:pointer; font-family:var(--font-ui); text-decoration:none; }
  .account-menu-item:hover{ background:var(--surface-alt); }
  .page-title{ font-family:var(--font-display); font-size:26px; font-weight:600; margin:0 0 4px 0; letter-spacing:-0.01em; }
  .page-sub{ color:var(--ink-muted); font-size:13px; margin:0; }
  .live-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-left:6px; vertical-align:middle; }
  .live-dot.on{ background:var(--st-recibido); }
  .live-dot.off{ background:var(--ink-muted); }
  .stats-row{ display:flex; gap:22px; flex-wrap:wrap; justify-content:center; }
  .stat-chip{ border-left:3px solid var(--accent); padding-left:10px; min-width:90px; }
  .stat-chip.warn{ border-left-color:var(--st-atrasado); }
  .stat-value{ font-family:var(--font-display); font-size:22px; font-weight:600; line-height:1.1; }
  .stat-label{ font-size:11.5px; color:var(--ink-muted); margin-top:2px; }
  button.stat-chip{ background:none; font-family:inherit; text-align:left; cursor:pointer; border-radius:4px; padding:4px 10px 4px 8px; margin:-4px -2px -4px -8px; transition:background 0.12s; }
  button.stat-chip:hover{ background:var(--surface-alt); }
  .stat-chip-active{ background:var(--accent) !important; }
  .stat-chip-active .stat-value, .stat-chip-active .stat-label{ color:#fff; }

  .tabs-row{ max-width:1280px; margin:0 auto; display:flex; gap:4px; }
  .tab-item{ background:none; border:none; padding:10px 4px; margin-right:22px; font-size:14px; font-family:var(--font-ui);
    color:var(--ink-muted); cursor:pointer; border-bottom:2px solid transparent; }
  .tab-item.active{ color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }

  .controls{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:14px 40px; background:var(--surface-alt); border-bottom:1px solid var(--border); }
  .controls-inner{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; max-width:1280px; margin:0 auto; width:100%; }
  .controls input[type=text], .controls select{
    font-family:var(--font-ui); font-size:13.5px; color:var(--ink); background:var(--surface); border:1px solid var(--border);
    border-radius:4px; padding:8px 10px; outline:none;
  }
  .controls input[type=text]:focus, .controls select:focus{ border-color:var(--accent); }
  .controls input[type=text]{ min-width:200px; flex:1; }
  .spacer{ flex:1; }

  .btn{ font-family:var(--font-ui); font-size:13.5px; font-weight:500; cursor:pointer; border-radius:4px; padding:9px 16px; border:1px solid transparent; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-ghost{ background:transparent; border-color:var(--border); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-sm{ padding:5px 10px; font-size:12.5px; }
  .btn:disabled{ opacity:0.55; cursor:default; }
  .link-btn{ background:none;border:none;color:var(--ink-muted);font-size:12.5px; text-decoration:underline; cursor:pointer; font-family:var(--font-ui); padding:0; }
  .link-btn:hover{ color:var(--ink); }
  .qty-btn{ width:26px; height:26px; border-radius:4px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:15px; font-weight:600; cursor:pointer; line-height:1; }
  .qty-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .tracking-link{ font-size:11.5px; color:var(--accent); text-decoration:none; font-weight:600; }
  .tracking-link:hover{ text-decoration:underline; }

  .main{ max-width:1280px; margin:0 auto; padding:24px 40px 80px; }
  .info-banner{ background:var(--accent-warm-bg); border:1px solid #E0C9A6; color:#5C4322; border-radius:4px; padding:10px 14px; font-size:13px; margin-bottom:18px; }
  .list-header{ display:flex; gap:16px; padding:0 16px 8px; font-size:11.5px; color:var(--ink-muted); border-bottom:1px solid var(--border); }
  .row-item{ display:flex; gap:16px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); border-left:4px solid var(--accent); background:var(--surface); }
  .col{ min-width:0; }
  .col-nombre, .col-proveedor{ flex:2.2; }
  .col-ubicacion, .col-destino{ flex:1; color:var(--ink-muted); }
  .col-categoria{ flex:1.2; }
  .col-cantidad{ flex:1.4; }
  .col-monto{ flex:1.3; }
  .col-estado{ flex:1.8; }
  .col-fecha{ flex:1; }
  .col-acciones{ flex:1.2; text-align:right; }
  .col-alertas{ flex:0 0 26px; display:flex; flex-direction:column; gap:4px; align-items:center; }
  .alerta-icono{ font-size:15px; line-height:1; cursor:default; }

  .item-nombre, .proveedor-name{ font-weight:600; margin-bottom:3px; }
  .item-notas{ font-size:12px; color:var(--ink-muted); }
  .tracking-line{ display:flex; align-items:center; gap:6px; color:var(--ink-muted); font-size:12.5px; }
  .courier-badge{ font-size:11px; font-weight:600; padding:1px 6px; border-radius:3px; background:var(--surface-alt); border:1px solid var(--border); color:var(--ink-muted); }
  .tracking-num{ font-family:var(--font-mono); font-size:12px; }
  .badge{ display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; background:var(--surface-alt); border:1px solid var(--border); color:var(--ink-muted); }
  .badge-agente{ background:var(--accent-warm-bg); color:var(--accent-warm); margin-left:8px; border:none; }
  .badge-revision{ background:var(--st-transito-bg); color:var(--st-transito); margin-left:8px; border:none; }
  .badge-atrasado{ background:var(--st-atrasado-bg); color:var(--st-atrasado); border:none; }
  .dias-label{ font-size:11.5px; color:var(--ink-muted); }
  .estado-select{ font-family:var(--font-ui); font-size:12.5px; font-weight:600; border-radius:20px; padding:4px 22px 4px 10px; border:1px solid var(--border);
    background-color:var(--surface); color:var(--sel-color, var(--ink)); cursor:pointer; margin-bottom:4px; display:block; }

  .empty-state{ padding:48px 16px; text-align:center; color:var(--ink-muted); font-family:var(--font-display); font-size:16px; }
  .footer-actions{ margin-top:22px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,20,18,0.45); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; }
  .modal{ background:var(--surface); border-radius:6px; max-width:560px; width:100%; padding:28px 30px 26px; box-shadow:0 12px 32px rgba(0,0,0,0.18); }
  .modal-title{ font-family:var(--font-display); font-size:20px; margin:0 0 4px; }
  .modal-close{ float:right; background:none; border:none; font-size:20px; color:var(--ink-muted); cursor:pointer; line-height:1; }
  .modal-tabs{ display:flex; gap:4px; margin:18px 0 18px; border-bottom:1px solid var(--border); }
  .tab-btn{ background:none; border:none; padding:9px 4px; margin-right:18px; font-size:13.5px; color:var(--ink-muted); cursor:pointer; border-bottom:2px solid transparent; font-family:var(--font-ui); }
  .tab-btn.active{ color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; }
  .form-field{ display:flex; flex-direction:column; gap:5px; }
  .form-field.full{ grid-column:1 / -1; }
  .form-field label{ font-size:12px; color:var(--ink-muted); }
  .form-field input, .form-field select, .form-field textarea{
    font-family:var(--font-ui); font-size:14px; padding:9px 10px; border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--ink); outline:none;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{ border-color:var(--accent); }
  .form-field textarea{ resize:vertical; min-height:70px; font-family:var(--font-ui); }
  .form-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .extract-status{ font-size:12.5px; color:var(--ink-muted); margin-top:8px; min-height:16px; }
  .field-note{ font-size:12px; color:var(--accent-warm); background:var(--accent-warm-bg); padding:8px 10px; border-radius:4px; margin-bottom:14px; }

  .assistant-toggle{ position:fixed; bottom:24px; right:24px; z-index:40; background:var(--accent); color:#fff; border:none; border-radius:24px;
    padding:12px 20px; font-family:var(--font-ui); font-size:13.5px; font-weight:600; cursor:pointer; box-shadow:0 6px 18px rgba(27,75,67,0.35); }
  .assistant-toggle:hover{ background:var(--accent-hover); }
  .assistant-panel{ position:fixed; top:0; right:0; height:100vh; width:390px; max-width:92vw; background:var(--surface); border-left:1px solid var(--border);
    z-index:45; display:flex; flex-direction:column; box-shadow:-8px 0 24px rgba(0,0,0,0.10); }
  .assistant-header{ padding:20px 20px 14px; border-bottom:1px solid var(--border); }
  .assistant-header h3{ font-family:var(--font-display); font-size:18px; margin:0 0 2px; }
  .assistant-header p{ font-size:12px; color:var(--ink-muted); margin:0; }
  .assistant-close{ float:right; background:none; border:none; font-size:19px; color:var(--ink-muted); cursor:pointer; }
  .quick-prompts{ display:flex; flex-wrap:wrap; gap:6px; padding:12px 20px; border-bottom:1px solid var(--border); }
  .quick-prompt-btn{ font-size:11.5px; padding:5px 10px; border-radius:20px; border:1px solid var(--border); background:var(--surface-alt); color:var(--ink); cursor:pointer; font-family:var(--font-ui); }
  .quick-prompt-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .chat-log{ flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px; }
  .chat-empty{ color:var(--ink-muted); font-size:13px; padding-top:12px; }
  .chat-msg{ max-width:88%; padding:9px 12px; border-radius:8px; font-size:13.5px; white-space:pre-wrap; }
  .chat-msg.user{ align-self:flex-end; background:var(--accent); color:#fff; }
  .chat-msg.assistant{ align-self:flex-start; background:var(--surface-alt); color:var(--ink); }
  .chat-typing{ align-self:flex-start; color:var(--ink-muted); font-size:12.5px; padding:0 4px; }
  .assistant-input-row{ display:flex; gap:8px; padding:14px 20px 20px; border-top:1px solid var(--border); }
  .assistant-input-row input{ flex:1; font-family:var(--font-ui); font-size:13.5px; padding:9px 10px; border:1px solid var(--border); border-radius:4px; outline:none; }
  .assistant-input-row input:focus{ border-color:var(--accent); }

  .toast{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:60; background:var(--ink); color:#fff; padding:11px 22px;
    border-radius:6px; font-size:13.5px; font-weight:500; box-shadow:0 8px 22px rgba(0,0,0,0.25); }

  @media (max-width:760px){
    .topbar, .controls, .main{ padding-left:18px; padding-right:18px; }
    .row-item{ flex-wrap:wrap; }
    .col-nombre, .col-proveedor{ flex:1 1 100%; }
    .col-ubicacion, .col-destino, .col-categoria, .col-cantidad, .col-monto, .col-estado, .col-fecha, .col-acciones{ flex:1 1 45%; }
    .list-header{ display:none; }
    .form-grid{ grid-template-columns:1fr; }
    .assistant-panel{ width:100%; max-width:100%; }
  }

  /* Específico de Subcontrataciones */
  .col-w-nombre{ flex:2.2; }
  .col-w-rut{ flex:1.1; }
  .col-w-rol{ flex:1.4; }
  .col-w-plat{ flex:1.8; display:flex; flex-wrap:wrap; gap:4px; }
  .rut-text{ font-family:var(--font-mono); font-size:12.5px; }
  .row-item.inactivo{ border-left-color:var(--ink-muted); background:var(--surface-alt); color:var(--ink-muted); }
  .badge-warn{ background:var(--accent-warm-bg); color:var(--accent-warm); border:none; }
  .badge-plat{ background:var(--st-destino-bg); color:var(--st-destino); border:none; }
  .badge-off{ background:var(--st-proceso-bg); color:var(--st-proceso); border:none; }
  .section-card{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:20px 22px; margin-bottom:18px; }
  .section-card h3{ font-family:var(--font-display); font-size:17px; margin:0 0 4px; }
  .section-card p.hint{ margin:0 0 14px; font-size:12.5px; color:var(--ink-muted); }
  .inline-add{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .inline-add input[type=text], .inline-add select{ font-family:var(--font-ui); font-size:13.5px; padding:8px 10px; border:1px solid var(--border); border-radius:4px; outline:none; background:var(--surface); color:var(--ink); }
  .inline-add input[type=text]{ min-width:220px; flex:1; max-width:340px; }
  .inline-add input[type=text]:focus, .inline-add select:focus{ border-color:var(--accent); }
  .chip-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:5px 12px; border-radius:20px; background:var(--surface-alt); border:1px solid var(--border); }
  .chip-btn{ background:none; border:none; cursor:pointer; color:var(--ink-muted); font-size:13px; line-height:1; padding:0 0 0 2px; }
  .chip-btn:hover{ color:var(--accent); }
  .check-row{ display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--border); font-size:13.5px; cursor:pointer; }
  .check-row:last-child{ border-bottom:none; }
  .check-row input{ width:16px; height:16px; accent-color:var(--accent); }
  .check-grid{ display:grid; grid-template-columns:1fr 1fr; gap:4px 18px; }
  .checks-box{ border:1px solid var(--border); border-radius:4px; padding:6px 12px; }
  .estado-box{ margin-top:18px; padding:12px 14px; border:1px solid var(--border); border-radius:4px; background:var(--surface-alt); font-size:13px; }
  .btn-danger{ background:var(--st-atrasado); color:#fff; }
  .btn-danger:hover{ opacity:0.9; }
  @media (max-width:760px){
    .col-w-nombre{ flex:1 1 100%; }
    .col-w-rut, .col-w-rol, .col-w-plat, .col-w-doc{ flex:1 1 45%; }
    .check-grid{ grid-template-columns:1fr; }
  }
  /* Etapa 3: documentos */
  .col-w-doc{ flex:1; }
  .badge-ok{ background:var(--st-recibido-bg); color:var(--st-recibido); border:none; }
  .badge-bad{ background:var(--st-atrasado-bg); color:var(--st-atrasado); border:none; }
  .doc-sec{ font-family:var(--font-display); font-size:15px; margin:20px 0 8px; }
  .doc-fila{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
  .doc-fila:last-child{ border-bottom:none; }
  .estado-box input[type=file]{ font-size:13px; max-width:100%; }
  .estado-box input[type=date]{ font-family:var(--font-ui); font-size:13.5px; padding:8px 10px; border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--ink); }
  /* Control mensual */
  .mes-nav{ display:flex; align-items:center; gap:6px; }
  .mes-nav select{ font-weight:600; }
  .mx{ background:var(--surface); border:1px solid var(--border); border-radius:6px; overflow-x:auto; }
  .mx-row{ display:grid; gap:14px; padding:12px 16px; border-bottom:1px solid var(--border); align-items:start; min-width:620px; }
  .mx-row:last-child{ border-bottom:none; }
  .mx-head{ background:var(--surface-alt); font-size:11.5px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.04em; align-items:center; padding-top:9px; padding-bottom:9px; }
  .mx-name{ display:flex; flex-direction:column; gap:1px; font-size:13.5px; }
  .mx-cell{ display:flex; flex-direction:column; gap:8px; }
  .mx-doc{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .mx-chips{ display:flex; flex-wrap:wrap; gap:5px; }
  .mini-btn{ background:none; border:1px solid var(--border); border-radius:4px; padding:2px 8px; font-size:12px; font-family:var(--font-ui); color:var(--ink-muted); cursor:pointer; }
  .mini-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .pchip{ font-family:var(--font-ui); font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px; border:1px solid transparent; cursor:pointer; line-height:1.3; text-align:left; }
  .pchip:disabled{ cursor:default; }
  .pchip-ok{ background:var(--st-recibido-bg); color:var(--st-recibido); }
  .pchip-pendiente{ background:var(--st-proceso-bg); color:var(--st-proceso); border-color:var(--border); }
  .pchip-porvencer{ background:var(--accent-warm-bg); color:var(--accent-warm); }
  .pchip-atrasado{ background:var(--st-atrasado-bg); color:var(--st-atrasado); }
  .pchip:not(:disabled):hover{ border-color:var(--accent); }
  .ms-list{ max-height:46vh; overflow-y:auto; border:1px solid var(--border); border-radius:4px; margin-top:4px; }
  .ms-row{ display:grid; grid-template-columns:minmax(150px,2fr) minmax(150px,1.6fr) minmax(130px,1.2fr) minmax(120px,1fr) 130px; gap:10px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; }
  .ms-list .ms-row:last-child{ border-bottom:none; }
  .ms-head{ margin-top:16px; border:none; font-size:11.5px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.04em; padding-bottom:4px; }
  .ms-file{ overflow:hidden; text-overflow:ellipsis; word-break:break-all; }
  .ms-row select{ font-family:var(--font-ui); font-size:12.5px; padding:6px 8px; border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--ink); min-width:0; width:100%; }
  .ms-estado{ display:flex; align-items:center; gap:6px; justify-content:space-between; }
  @media (max-width:760px){
    .ms-row{ grid-template-columns:1fr 1fr; }
    .ms-head{ display:none; }
  }
  /* Trabajadores: columna del mes y filas que se pueden pinchar */
  .col-w-mes{ flex:1.1; }
  .row-click{ cursor:pointer; }
  .row-click:hover{ background:var(--surface-alt); }
  .controls-inner .mes-nav{ flex:none; }

  /* Controles agrupados y contadores en cuadrícula */
  .ctl-mes{ display:inline-flex; align-items:center; gap:8px; flex:none; }

function periodoISO(y, m){ return y + '-' + String(m).padStart(2, '0') + '-01'; }
function periodoMesAnterior(){
  const d = new Date();
  let y = d.getFullYear(), m = d.getMonth();     // getMonth() es 0-11: sirve como «mes anterior» en base 1
  if(m === 0){ y--; m = 12; }

/* ============================================================

function escapeHTML(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function withTimeout(promise, ms){
  return Promise.race([ promise, new Promise((_, reject)=> setTimeout(()=> reject(new Error('La operación tardó demasiado')), ms)) ]);
}
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function aviso(msg, ms){
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(aviso._t);
  aviso._t = setTimeout(()=>{ el.style.display = 'none'; }, ms || 2800);
}
function mensajeError(e){
  if(e && e.code === '23505') return 'Ya existe un registro con ese valor.';
  if(e && e.code === '23503') return 'Está en uso por otros datos y no se puede eliminar.';
  if(e && (e.code === '42501' || /row-level security/i.test(e.message || ''))) return 'Tu cuenta no tiene permiso para hacer este cambio.';
  return (e && e.message) ? e.message : 'error desconocido';
}

/* RUT: se guarda sin puntos, con guion y K mayúscula (formato que exige la base de datos) */
function normalizarRut(s){
  s = String(s || '').replace(/[.\s]/g, '').toUpperCase();
  if(s.length > 1 && !s.includes('-')) s = s.slice(0, -1) + '-' + s.slice(-1);
  return s;
}
function rutValido(r){
  const m = /^(\d{7,8})-([0-9K])$/.exec(r);
  if(!m) return false;
  let suma = 0, mult = 2;
  for(let i = m[1].length - 1; i >= 0; i--){
    suma += parseInt(m[1][i], 10) * mult;
    mult = mult === 7 ? 2 : mult + 1;
  }
  const res = 11 - (suma % 11);
  const dv = res === 11 ? '0' : (res === 10 ? 'K' : String(res));
  return dv === m[2];
}
function fmtRut(r){
  const m = /^(\d{7,8})-([0-9K])$/.exec(r || '');
  if(!m) return r || '';
  return m[1].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + m[2];
}

async function cargarAcceso(){
  const uid = state.session.user.id;

    completo = !!(p.data && p.data.acceso_completo);
  }catch(e){ /* queda en false */ }
  const a = await supabaseClient.from('perfiles_acceso').select('area,rol').eq('perfil_id', uid);
  if(a.error) throw new Error(a.error.message);
  const fila = (a.data || []).find(x => x.area === AREA);
  state.accesoCompleto = completo;
  state.acceso = completo || !!fila;
  state.puedeEscribir = !!(fila && fila.rol === 'editor');
}
async function cargarDatos(){
  const q = (t, ord) => supabaseClient.from(t).select('*').order(ord);
  const res = await withTimeout(Promise.all([
    q('roles_faena', 'nombre'),
    q('tipos_documento', 'nombre'),
    q('plataformas_destino', 'nombre'),
    supabaseClient.from('documentos_requeridos_por_rol').select('*'),
    q('trabajadores_subcontratados', 'nombre'),
    supabaseClient.from('trabajador_plataforma').select('*'),
    supabaseClient.from('documentos_vigentes').select('*').is('periodo', null)    // los de ingreso / con vencimiento; los mensuales se cargan por mes
  ]), 15000);
  for(const r of res){ if(r.error) throw new Error(r.error.message); }
  state.roles = res[0].data; state.tipos = res[1].data; state.plataformas = res[2].data;
  state.requeridos = res[3].data; state.trabajadores = res[4].data; state.tp = res[5].data; state.docsVig = res[6].data;
}
async function recargar(){
  try{ await cargarDatos(); state.loadError = null; }
  catch(e){ state.loadError = 'No se pudo cargar la información: ' + mensajeError(e); }
  render();
}

function rolNombre(id){ const r = state.roles.find(x => x.id === id); return r ? r.nombre : null; }
function plataformasActivasDe(trabId){

}

/* ============================================================
   ESTADO DOCUMENTAL (se calcula al leer, no se guarda)
   ============================================================ */
function hoyISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function diasHasta(iso){
  const a = iso.split('-').map(Number), b = hoyISO().split('-').map(Number);
  return Math.round((Date.UTC(a[0], a[1] - 1, a[2]) - Date.UTC(b[0], b[1] - 1, b[2])) / 86400000);
}
function fmtFecha(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? m[3] + '-' + m[2] + '-' + m[1] : (iso || '');
}
function docVigente(trabId, tipoId){
  return state.docsVig.find(x => x.trabajador_id === trabId && x.tipo_documento_id === tipoId) || null;
}
// Estado de UN documento exigido: ok | porvencer | vencido | falta | sinfecha
function estadoDoc(tipo, doc){
  if(!doc) return { k: 'falta' };
  if(!tipo.vence) return { k: 'ok' };
  if(!doc.fecha_vencimiento) return { k: 'sinfecha' };
  const d = diasHasta(doc.fecha_vencimiento);
  if(d < 0) return { k: 'vencido', dias: d };
  if(d <= DIAS_POR_VENCER) return { k: 'porvencer', dias: d };
  return { k: 'ok', dias: d };
}
// Estado del trabajador según los documentos que exige su rol.
// Prioridad: vencido > incompleto > por vencer > al día.
// Un tipo es «obligatorio al ingresar» si está marcado en Catálogos (vale para todos los roles).
function esObligatorio(tipoId){ return state.requeridos.some(x => x.tipo_documento_id === tipoId); }
function tiposObligatorios(){
  return state.tipos.filter(t => t.ambito === 'trabajador' && t.frecuencia !== 'mensual' && esObligatorio(t.id));   // los mensuales se controlan por mes
}
function estadoTrabajador(w){
  if(!w.activo) return null;
  const exigidos = tiposObligatorios();
  if(!exigidos.length) return { k: 'sinreq', items: [] };
  const items = exigidos.map(t => ({ tipo: t, doc: docVigente(w.id, t.id), est: estadoDoc(t, docVigente(w.id, t.id)) }));
  const tiene = k => items.some(i => i.est.k === k);
  let k = 'aldia';
  if(tiene('vencido')) k = 'vencido';
  else if(tiene('falta') || tiene('sinfecha')) k = 'incompleto';
  else if(tiene('porvencer')) k = 'porvencer';
  return { k, items };
}
const ETIQ_ESTADO = { aldia: 'Al día', porvencer: 'Por vencer', vencido: 'Vencido', incompleto: 'Incompleto', sinrol: 'Sin rol', sinreq: 'Sin requisitos' };
const CLASE_ESTADO = { aldia: 'badge-ok', porvencer: 'badge-warn', vencido: 'badge-bad', incompleto: 'badge-bad', sinrol: 'badge-off', sinreq: 'badge-off' };
function badgeEstado(k){ return `<span class="badge ${CLASE_ESTADO[k]}">${ETIQ_ESTADO[k]}</span>`; }
function textoEstadoDoc(e){
  if(e.k === 'falta') return 'Falta subir';
  if(e.k === 'sinfecha') return 'Sin fecha de vencimiento';
  if(e.k === 'vencido') return 'Vencido hace ' + pl(-e.dias, 'día', 'días');
  if(e.k === 'porvencer') return e.dias === 0 ? 'Vence hoy' : 'Vence en ' + pl(e.dias, 'día', 'días');
  return 'Vigente';
}

/* ============================================================
   TRABAJADORES
   ============================================================ */
function trabajadoresFiltrados(){
  const f = state.filtros;
  const t = f.texto.trim().toLowerCase();
  const tRut = t.replace(/[.\s]/g, '');
  return state.trabajadores.filter(w => {
    if(f.estado === 'activos' && !w.activo) return false;
    if(f.estado === 'inactivos' && w.activo) return false;
    if(f.rol === '__sin'){ if(w.rol_faena_id != null) return false; }
    else if(f.rol && String(w.rol_faena_id) !== f.rol) return false;
    if(f.plataforma && !state.tp.some(x => x.trabajador_id === w.id && String(x.plataforma_id) === f.plataforma && x.activo)) return false;
    if(f.doc === 'm_pend' || f.doc === 'm_atras'){
      if(!w.activo) return false;
      const r = resumenTrabajadorMes(w);
      if(f.doc === 'm_pend' && !(r.faltan || r.porCargar)) return false;
      if(f.doc === 'm_atras' && !r.atrasados) return false;
    }else if(f.doc){ const e = estadoTrabajador(w); if(!e || e.k !== f.doc) return false; }
    if(t && !(w.nombre.toLowerCase().includes(t) || (tRut && w.rut.toLowerCase().includes(tRut)))) return false;
    return true;
  });
}
function statsHTML(){
  const activos = state.trabajadores.filter(w => w.activo);
  const sinRol = activos.filter(w => w.rol_faena_id == null).length;
  const sinPlat = activos.filter(w => plataformasActivasDe(w.id).length === 0).length;
  const ests = activos.map(estadoTrabajador);
  const cuenta = k => ests.filter(e => e && e.k === k).length;
  const chip = (v, l, warn) => `<div class="stat-chip ${warn && v > 0 ? 'warn' : ''}"><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div>`;
  const mt = totalesMesTrabajadores();

         chip(mt.faltan, 'Docs. del mes por recibir', true) +
         chip(mt.atrasados, 'Cargas con plazo vencido', true);
}

      <div class="col col-w-doc">${est ? badgeEstado(est.k) : '<span class="dias-label">—</span>'}</div>

      <div class="col col-acciones"><button type="button" class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); abrirModalDocs(${w.id})">Documentos</button>${state.puedeEscribir ? ` <button type="button" class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); abrirModalTrabajador(${w.id})">Editar</button>` : ''}</div>

async function guardarTrabajador(){
  if(state.saving) return;
  const esNuevo = state.modal.id == null;
  const nombre = val('w-nombre').trim().replace(/\s+/g, ' ');
  const rolId = val('w-rol') ? Number(val('w-rol')) : null;
  const marcadas = Array.from(document.querySelectorAll('.chk-plat:checked')).map(el => Number(el.value));
  state.modal.draft = { nombre: val('w-nombre'), rut: val('w-rut'), rol: val('w-rol'), plats: marcadas };
  if(!nombre){ state.modalError = 'Escribe el nombre del trabajador.'; render(); return; }
  let rut = null;
  if(esNuevo){
    rut = normalizarRut(val('w-rut'));
    if(!rutValido(rut)){ state.modalError = 'El RUT no es válido. Revisa el número y el dígito verificador (ej.: 12.345.678-5).'; render(); return; }
  }
  state.saving = true; state.modalError = null; render();
  try{
    let trabId = state.modal.id;
    if(esNuevo){
      const r = await withTimeout(supabaseClient.from('trabajadores_subcontratados').insert({ rut, nombre, rol_faena_id: rolId }).select('id').single(), 10000);
      if(r.error) throw r.error;
      trabId = r.data.id;
    }else{
      const r = await withTimeout(supabaseClient.from('trabajadores_subcontratados').update({ nombre, rol_faena_id: rolId }).eq('id', trabId), 10000);
      if(r.error) throw r.error;
    }
    const w = state.trabajadores.find(x => x.id === trabId);
    if(esNuevo || (w && w.activo)){
      for(const p of state.plataformas){
        const fila = state.tp.find(x => x.trabajador_id === trabId && x.plataforma_id === p.id);
        const quiere = marcadas.includes(p.id);
        const tiene = !!(fila && fila.activo);
        if(quiere === tiene) continue;
        const r = await withTimeout(supabaseClient.from('trabajador_plataforma').upsert({ trabajador_id: trabId, plataforma_id: p.id, activo: quiere }, { onConflict: 'trabajador_id,plataforma_id' }), 10000);
        if(r.error) throw r.error;
      }
    }
    state.modal = null; state.saving = false;
    await recargar();
    aviso(esNuevo ? 'Trabajador agregado.' : 'Cambios guardados.');
  }catch(e){
    state.saving = false;
    state.modalError = 'No se pudo guardar: ' + mensajeError(e);
    // Si el trabajador sí se creó antes del error, evitamos un duplicado al reintentar.
    await recargar();
    render();
  }
}
async function desactivarTrabajador(id){
  if(state.saving) return;
  state.saving = true; render();
  try{
    const r = await withTimeout(supabaseClient.from('trabajadores_subcontratados').update({ activo: false }).eq('id', id), 10000);
    if(r.error) throw r.error;

}

function nombreSeguro(n){
  const base = String(n || 'archivo').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '_').replace(/^_+|_+$/g, '');
  return (base || 'archivo').slice(-80);
}
function uuidCorto(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

// Últimos 18 meses (para elegir el mes al que corresponde un documento mensual)
function opcionesPeriodo(sel){
  const hoy = new Date();
  let y = hoy.getFullYear(), m = hoy.getMonth() + 1;
  let html = '', hallado = false;
  for(let i = 0; i < 18; i++){
    const p = periodoISO(y, m);
    if(p === sel) hallado = true;
    html += `<option value="${p}" ${p === sel ? 'selected' : ''}>${escapeHTML(fmtPeriodo(p))}</option>`;
    m--; if(m === 0){ m = 12; y--; }
  }
  if(sel && !hallado) html += `<option value="${escapeHTML(sel)}" selected>${escapeHTML(fmtPeriodo(sel))}</option>`;     // mes fuera de los últimos 18: se muestra igual
  return html;
}

async function subirDocumento(){
  const m = state.modalDocs;
  if(!m || m.subiendo || !state.puedeEscribir) return;
  guardarDraftDocs();
  const tipo = state.tipos.find(t => String(t.id) === String(m.draft.tipo));
  const input = document.getElementById('d-archivo');
  const archivo = input && input.files && input.files[0];
  const fallo = msg => { m.error = msg; render(); };
  if(!tipo) return fallo('Elige el tipo de documento.');
  if(!archivo) return fallo('Elige el archivo a subir.');
  if(!TIPOS_ARCHIVO.includes(archivo.type)) return fallo('Formato no permitido. Sube un PDF o una imagen (JPG, PNG, WEBP).');
  if(archivo.size > MAX_ARCHIVO_MB * 1024 * 1024) return fallo('El archivo pesa más de ' + MAX_ARCHIVO_MB + ' MB.');
  if(archivo.size === 0) return fallo('El archivo está vacío.');
  let venc = null;
  if(tipo.vence){
    venc = m.draft.venc;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(venc || '')) return fallo('Indica la fecha de vencimiento de este documento.');
  }
  let periodo = null;
  if(tipo.frecuencia === 'mensual'){
    periodo = m.draft.periodo;
    if(!/^\d{4}-\d{2}-01$/.test(periodo || '')) return fallo('Elige el mes al que corresponde este documento.');
  }
  const trabId = m.id;
  const path = trabId + '/' + uuidCorto() + '-' + nombreSeguro(archivo.name);
  m.subiendo = true; m.error = null; render();
  let subido = false;
  try{
    const up = await withTimeout(supabaseClient.storage.from(BUCKET).upload(path, archivo, { contentType: archivo.type, upsert: false }), 60000);
    if(up.error) throw up.error;
    subido = true;
    const ins = await withTimeout(supabaseClient.from('documentos_trabajador').insert({
      trabajador_id: trabId, tipo_documento_id: tipo.id, archivo_path: path, nombre_archivo: archivo.name, fecha_vencimiento: venc, periodo
    }), 12000);
    if(ins.error) throw ins.error;
    if(state.modalDocs !== m) return;      // cerraron el modal mientras subía
    m.subiendo = false; m.draft = { tipo: '', venc: '', periodo: state.mes };
    await recargar();
    await cargarHistorial(trabId);
    aviso('Documento subido.');
  }catch(e){
    if(state.modalDocs !== m){ aviso('No se pudo subir el documento: ' + mensajeError(e), 3600); return; }
    m.subiendo = false;
    m.error = 'No se pudo subir: ' + mensajeError(e) + (subido ? ' (el archivo llegó pero no se registró; vuelve a intentarlo)' : '');
    render();
  }
}

async function verDocumento(id, vigente){
  if(!state.puedeEscribir){ aviso('Solo los editores pueden abrir los archivos.'); return; }
  const m = state.modalDocs;
  let doc = null;
  if(vigente) doc = state.docsVig.find(x => x.id === id);
  else if(m && m.historial) doc = m.historial.find(x => x.id === id);
  if(!doc){ aviso('No se encontró el documento.'); return; }
  const win = window.open('', '_blank');       // se abre antes de esperar para que el navegador no lo bloquee
  try{
    const r = await withTimeout(supabaseClient.storage.from(BUCKET).createSignedUrl(doc.archivo_path, 120), 12000);
    if(r.error) throw r.error;
    const url = r.data && (r.data.signedUrl || r.data.signedURL);
    if(!url) throw new Error('No se obtuvo el enlace del archivo.');
    if(win) win.location.href = url; else window.location.href = url;
  }catch(e){
    if(win) win.close();
    aviso('No se pudo abrir el documento: ' + mensajeError(e), 3600);
  }
}

/* ============================================================
   CONTROL MENSUAL
   Por cada mes: qué documentos mensuales llegaron (recibido) y cuáles ya se subieron
   a cada plataforma (cargado). El plazo de cada plataforma es un día del mes siguiente.
   ============================================================ */
const ETIQ_FREC = { unica: 'una vez', mensual: 'mensual', vence: 'vence' };
function fmtPeriodo(p){
  const m = /^(\d{4})-(\d{2})/.exec(p || '');
  if(!m) return p || '';
  const n = MESES[Number(m[2]) - 1] || '';
  return n.charAt(0).toUpperCase() + n.slice(1) + ' ' + m[1];
}
function desplazarPeriodo(p, delta){
  const a = p.split('-').map(Number);
  let y = a[0], m = a[1] + delta;
  while(m > 12){ m -= 12; y++; }
  while(m < 1){ m += 12; y--; }
  return periodoISO(y, m);
}
// Fecha límite de carga de un mes: el día «plazo_dia» del mes siguiente (ajustado si ese mes es más corto)
function plazoISO(periodo, plat){
  const a = periodo.split('-').map(Number);
  let y = a[0], m = a[1] + 1;
  if(m > 12){ m = 1; y++; }
  const ult = new Date(y, m, 0).getDate();
  const dia = Math.min(plat.plazo_dia || 20, ult);
  return y + '-' + String(m).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
}
// Estado de UNA carga a plataforma: ok | atrasado | porvencer | pendiente
function estadoCarga(periodo, plat, cargado){
  if(cargado) return { k: 'ok' };
  const d = diasHasta(plazoISO(periodo, plat));
  if(d < 0) return { k: 'atrasado', dias: d };
  if(d <= AVISO_DIAS) return { k: 'porvencer', dias: d };
  return { k: 'pendiente', dias: d };
}
function textoCarga(periodo, plat, est){
  const f = fmtFecha(plazoISO(periodo, plat));
  if(est.k === 'ok') return plat.nombre + ': cargado en la plataforma';
  if(est.k === 'atrasado') return plat.nombre + ': plazo vencido el ' + f + ' (hace ' + pl(-est.dias, 'día', 'días') + ')';
  if(est.k === 'porvencer') return plat.nombre + ': vence el ' + f + (est.dias === 0 ? ' (hoy)' : ' (en ' + pl(est.dias, 'día', 'días') + ')');
  return plat.nombre + ': plazo el ' + f;
}
function tiposMensuales(ambito){ return state.tipos.filter(t => t.frecuencia === 'mensual' && t.ambito === ambito); }
function docMes(trabId, tipoId){ return state.docsMes.find(x => x.trabajador_id === trabId && x.tipo_documento_id === tipoId) || null; }
function docEmpresaMes(tipoId){ return state.docsEmpresa.find(x => x.tipo_documento_id === tipoId) || null; }   // vienen ordenados: el más reciente primero
function cargaMes(trabId, tipoId, platId){
  return state.cargas.find(c => (c.trabajador_id == null ? null : c.trabajador_id) === trabId && c.tipo_documento_id === tipoId && c.plataforma_id === platId) || null;
}
function plataformasConTrabajadores(){
  const ids = new Set(state.tp.filter(x => x.activo).map(x => x.plataforma_id));
  return state.plataformas.filter(p => ids.has(p.id));
}
function platsVisibles(w){
  const ps = plataformasActivasDe(w.id);
  return state.filtros.plataforma ? ps.filter(p => String(p.id) === state.filtros.plataforma) : ps;
}
function platsEmpresaVisibles(){
  const ps = plataformasConTrabajadores();
  return state.filtrosMes.plataforma ? ps.filter(p => String(p.id) === state.filtrosMes.plataforma) : ps;
}
function resumenTrabajadorMes(w){
  let faltan = 0, porCargar = 0, atrasados = 0, porVencer = 0;
  for(const t of tiposMensuales('trabajador')){
    if(!docMes(w.id, t.id)) faltan++;
    for(const p of platsVisibles(w)){
      const e = estadoCarga(state.mes, p, !!cargaMes(w.id, t.id, p.id));
      if(e.k !== 'ok') porCargar++;
      if(e.k === 'atrasado') atrasados++;
      if(e.k === 'porvencer') porVencer++;
    }
  }
  return { faltan, porCargar, atrasados, porVencer };
}
// Totales del mes sobre los trabajadores activos (respeta el filtro de plataforma de la lista)
function totalesMesTrabajadores(){
  const t = { faltan: 0, porCargar: 0, atrasados: 0, porVencer: 0 };
  for(const w of state.trabajadores.filter(x => x.activo)){
    const r = resumenTrabajadorMes(w);
    t.faltan += r.faltan; t.porCargar += r.porCargar; t.atrasados += r.atrasados; t.porVencer += r.porVencer;
  }
  return t;
}
function statsEmpresaHTML(){
  let faltan = 0, porCargar = 0, atrasados = 0, porVencer = 0;
  const ps = platsEmpresaVisibles();
  for(const t of tiposMensuales('empresa')){
    if(!docEmpresaMes(t.id)) faltan++;
    for(const p of ps){
      const e = estadoCarga(state.mes, p, !!cargaMes(null, t.id, p.id));
      if(e.k !== 'ok') porCargar++;
      if(e.k === 'atrasado') atrasados++;
      if(e.k === 'porvencer') porVencer++;
    }
  }
  const chip = (v, l, warn) => `<div class="stat-chip ${warn && v > 0 ? 'warn' : ''}"><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div>`;
  return chip(faltan, 'Documentos por recibir', true) +
         chip(porCargar, 'Por cargar en plataformas', false) +
         chip(atrasados, 'Con plazo vencido', true) +
         chip(porVencer, 'Por vencer (≤ ' + AVISO_DIAS + ' días)', true);
}
// Resumen del mes de UN trabajador, para la columna de la lista
function resumenMesBadge(w){
  if(!w.activo) return '<span class="dias-label">—</span>';
  const tipos = tiposMensuales('trabajador');
  if(!tipos.length) return '<span class="dias-label">—</span>';
  if(state.cargandoMes) return '<span class="dias-label">Cargando…</span>';
  const r = resumenTrabajadorMes(w);
  const recibidos = tipos.length - r.faltan;
  let clase, texto;
  if(r.atrasados){ clase = 'badge-bad'; texto = 'Plazo vencido'; }
  else if(r.faltan){ clase = 'badge-bad'; texto = 'Falta recibir'; }
  else if(r.porVencer){ clase = 'badge-warn'; texto = 'Por vencer'; }
  else if(r.porCargar){ clase = 'badge-off'; texto = 'Por cargar'; }
  else { clase = 'badge-ok'; texto = 'Al día'; }
  return `<span class="badge ${clase}">${texto}</span><div class="dias-label">${recibidos}/${tipos.length} recibidos</div>`;
}
// Redibuja lo que depende de los datos del mes (lista, ficha abierta, pestaña de empresa)
function refrescarVistas(){
  actualizarMes();
  if(state.tab === 'trabajadores'){
    actualizarLista();
    const s = document.getElementById('stats-row');
    if(s) s.innerHTML = statsHTML();
    if(state.modalDocs) render();
  }
}

function chipCargaHTML(trabId, tipoId, p){
  const est = estadoCarga(state.mes, p, !!cargaMes(trabId, tipoId, p.id));
  const ico = est.k === 'ok' ? '✓ ' : (est.k === 'atrasado' ? '! ' : '');
  const clic = state.puedeEscribir ? `onclick="toggleCarga(${trabId === null ? 'null' : trabId}, ${tipoId}, ${p.id})"` : 'disabled';
  return `<button type="button" class="pchip pchip-${est.k}" title="${escapeHTML(textoCarga(state.mes, p, est))}" ${clic}>${ico}${escapeHTML(p.nombre)}</button>`;
}
// Documentos del mes de UN trabajador (se muestra dentro de su ficha)
function seccionMesHTML(w){
  const tipos = tiposMensuales('trabajador');
  const ed = state.puedeEscribir;
  const ps = plataformasActivasDe(w.id);
  const nav = navMesHTML();
  if(!tipos.length) return `<h4 class="doc-sec">Documentos del mes</h4><div class="dias-label">No hay documentos mensuales definidos (se crean en Catálogos con frecuencia «Todos los meses»).</div>`;
  let cuerpo;
  if(state.errorMes) cuerpo = `<div class="dias-label" style="color:var(--st-atrasado);">${escapeHTML(state.errorMes)} <button type="button" class="link-btn" onclick="cargarMes()">Reintentar</button></div>`;
  else if(state.cargandoMes) cuerpo = '<div class="dias-label">Cargando el mes…</div>';
  else cuerpo = tipos.map(t => {
    const doc = docMes(w.id, t.id);
    const chips = ps.length ? ps.map(p => chipCargaHTML(w.id, t.id, p)).join('') : '<span class="dias-label">Sin plataforma asignada</span>';
    return `
    <div class="doc-fila" style="align-items:flex-start;">
      <div><b>${escapeHTML(t.nombre)}</b><div class="mx-chips" style="margin-top:6px;">${chips}</div></div>
      <div class="mx-doc">
        ${doc ? '<span class="badge badge-ok">Recibido</span>' : '<span class="badge badge-bad">Falta</span>'}
        ${doc && ed ? `<button type="button" class="mini-btn" onclick="verDocMes(${doc.id}, false)">Ver</button>` : ''}
        ${ed ? `<button type="button" class="mini-btn" onclick="abrirSubirMes(${w.id}, ${t.id})">${doc ? 'Reemplazar' : 'Subir'}</button>` : ''}
      </div>
    </div>`;
  }).join('');
  return `<h4 class="doc-sec">Documentos del mes</h4>${nav}
    <div class="dias-label" style="margin:0 0 6px;">Cada botón de plataforma indica si ya subiste ese documento allá${ed ? ' (clic para marcarlo o desmarcarlo)' : ''}. Gris: pendiente · ámbar: el plazo está cerca · rojo: plazo vencido · verde: cargado.</div>
    ${cuerpo}`;
}
function matrizEmpresaHTML(){
  const tipos = tiposMensuales('empresa');
  if(!tipos.length) return `<div class="empty-state">No hay documentos de la empresa. Créalos en Catálogos con ámbito «Empresa» y frecuencia «Mensual».</div>`;
  const ps = platsEmpresaVisibles();
  const ed = state.puedeEscribir;
  const cols = 'grid-template-columns:minmax(190px,1fr) minmax(170px,1fr) minmax(260px,3fr);';
  const head = `<div class="mx-row mx-head" style="${cols}"><div>Documento de la empresa</div><div>Recibido</div><div>Cargado en cada plataforma</div></div>`;
  const filas = tipos.map(t => {
    const doc = docEmpresaMes(t.id);
    const chips = ps.length ? ps.map(p => chipCargaHTML(null, t.id, p)).join('') : '<span class="dias-label">Aún no hay trabajadores asignados a plataformas.</span>';
    return `<div class="mx-row" style="${cols}">
      <div class="mx-name"><b>${escapeHTML(t.nombre)}</b></div>
      <div class="mx-doc">${doc ? '<span class="badge badge-ok">Recibido</span>' : '<span class="badge badge-bad">Falta</span>'}
        ${doc && ed ? `<button type="button" class="mini-btn" onclick="verDocMes(${doc.id}, true)">Ver</button>` : ''}
        ${ed ? `<button type="button" class="mini-btn" onclick="abrirSubirMes(null, ${t.id})">${doc ? 'Reemplazar' : 'Subir'}</button>` : ''}</div>
      <div class="mx-chips">${chips}</div></div>`;
  }).join('');
  return `<div class="mx">${head}${filas}</div>`;
}
function contenidoMesHTML(){
  if(state.errorMes) return `<div class="field-note" style="background:var(--st-atrasado-bg);color:var(--st-atrasado);">${escapeHTML(state.errorMes)} <button type="button" class="link-btn" onclick="cargarMes()">Reintentar</button></div>`;
  if(state.cargandoMes) return `<div class="empty-state">Cargando ${escapeHTML(fmtPeriodo(state.mes))}…</div>`;
  return matrizEmpresaHTML();
}
function actualizarMes(){
  const c = document.getElementById('mes-container');
  if(c) c.innerHTML = contenidoMesHTML();
  const s = document.getElementById('stats-row');
  if(s && state.tab === 'empresa') s.innerHTML = statsEmpresaHTML();
}
async function cargarMes(){
  const p = state.mes;
  state.cargandoMes = true; state.errorMes = null; actualizarMes(); actualizarLista();
  try{
    const res = await withTimeout(Promise.all([
      supabaseClient.from('documentos_vigentes').select('*').eq('periodo', p),
      supabaseClient.from('cargas_plataforma').select('*').eq('periodo', p),
      supabaseClient.from('documentos_empresa').select('*').eq('periodo', p).order('creado_en', { ascending: false })
    ]), 15000);
    for(const r of res){ if(r.error) throw new Error(r.error.message); }
    if(state.mes !== p) return;              // cambiaron de mes mientras cargaba: la carga del mes nuevo se encarga
    state.docsMes = res[0].data || []; state.cargas = res[1].data || []; state.docsEmpresa = res[2].data || [];
  }catch(e){
    if(state.mes !== p) return;
    state.errorMes = 'No se pudo cargar el mes: ' + mensajeError(e);
  }
  state.cargandoMes = false;
  refrescarVistas();
}
function elegirMes(p){
  if(!/^\d{4}-\d{2}-01$/.test(p || '')) return;
  state.mes = p; state.docsMes = []; state.cargas = []; state.docsEmpresa = [];
  state.cargandoMes = true; state.errorMes = null;
  render(); cargarMes();
}
function cambiarMes(delta){
  const p = desplazarPeriodo(state.mes, delta);
  if(p > periodoISO(new Date().getFullYear(), new Date().getMonth() + 1)) return;     // no más allá del mes actual
  elegirMes(p);
}
function navMesHTML(){
  return `
    <div class="mes-nav">
      <button type="button" class="btn btn-ghost btn-sm" onclick="cambiarMes(-1)" aria-label="Mes anterior">‹</button>
      <select onchange="elegirMes(this.value)" aria-label="Mes">${opcionesPeriodo(state.mes)}</select>
      <button type="button" class="btn btn-ghost btn-sm" onclick="cambiarMes(1)" aria-label="Mes siguiente">›</button>
    </div>`;
}
function controlesEmpresaHTML(){
  const f = state.filtrosMes;
  return `
    <span class="dias-label">Documentos de la empresa del mes:</span>
    ${navMesHTML()}
    <select onchange="state.filtrosMes.plataforma=this.value; actualizarMes();">
      <option value="">Todas las plataformas</option>
      ${plataformasConTrabajadores().map(p => `<option value="${p.id}" ${f.plataforma === String(p.id) ? 'selected' : ''}>${escapeHTML(p.nombre)}</option>`).join('')}
    </select>`;
}

/* --- Marcar «cargado en plataforma» --- */
async function toggleCarga(trabId, tipoId, platId){
  if(!state.puedeEscribir) return;
  const clave = trabId + '|' + tipoId + '|' + platId;
  if(state.ocupadoCarga[clave]) return;
  state.ocupadoCarga[clave] = true;
  const existe = cargaMes(trabId, tipoId, platId);
  try{
    if(existe){
      const r = await withTimeout(supabaseClient.from('cargas_plataforma').delete().eq('id', existe.id).select('id'), 10000);
      if(r.error) throw r.error;
      if(!r.data || !r.data.length) throw new Error('No se aplicó el cambio (revisa tus permisos).');
      state.cargas = state.cargas.filter(c => c.id !== existe.id);
    }else{
      const r = await withTimeout(supabaseClient.from('cargas_plataforma').insert({ trabajador_id: trabId, tipo_documento_id: tipoId, plataforma_id: platId, periodo: state.mes }).select('*').single(), 10000);
      if(r.error) throw r.error;
      state.cargas.push(r.data);
    }
  }catch(e){
    aviso('No se pudo guardar el cambio: ' + mensajeError(e), 3600);
    if(e && e.code === '23505') await cargarMes();
  }
  delete state.ocupadoCarga[clave];
  refrescarVistas();
}

/* --- Subir un documento de un mes (de un trabajador o de la empresa) --- */
function validarArchivo(a){
  if(!a) return 'Elige el archivo a subir.';
  if(!TIPOS_ARCHIVO.includes(a.type)) return 'Formato no permitido. Sube un PDF o una imagen (JPG, PNG, WEBP).';
  if(a.size > MAX_ARCHIVO_MB * 1024 * 1024) return 'El archivo pesa más de ' + MAX_ARCHIVO_MB + ' MB.';
  if(a.size === 0) return 'El archivo está vacío.';
  return null;
}
async function guardarDocMes(trabId, tipoId, periodo, archivo){
  const path = (trabId ? String(trabId) : 'empresa') + '/' + uuidCorto() + '-' + nombreSeguro(archivo.name);
  const up = await withTimeout(supabaseClient.storage.from(BUCKET).upload(path, archivo, { contentType: archivo.type, upsert: false }), 60000);
  if(up.error) throw up.error;
  const fila = { tipo_documento_id: tipoId, periodo, archivo_path: path, nombre_archivo: archivo.name };
  const ins = trabId
    ? await withTimeout(supabaseClient.from('documentos_trabajador').insert(Object.assign({ trabajador_id: trabId, fecha_vencimiento: null }, fila)), 12000)
    : await withTimeout(supabaseClient.from('documentos_empresa').insert(fila), 12000);
  if(ins.error){ ins.error.archivoSubido = true; throw ins.error; }
}
function abrirSubirMes(trabId, tipoId){ state.modalMes = { trabId, tipoId, subiendo: false, error: null }; render(); }
function cerrarModalMes(){ if(state.modalMes && state.modalMes.subiendo) return; state.modalMes = null; render(); }
function modalMesHTML(){
  const m = state.modalMes;
  const t = state.tipos.find(x => x.id === m.tipoId);
  const w = m.trabId ? state.trabajadores.find(x => x.id === m.trabId) : null;
  if(!t || (m.trabId && !w)) return '';
  const existe = m.trabId ? docMes(m.trabId, m.tipoId) : docEmpresaMes(m.tipoId);
  return `
  <div class="modal-backdrop">
    <div class="modal" style="max-width:520px;">
      <button type="button" class="modal-close" onclick="cerrarModalMes()" aria-label="Cerrar">×</button>
      <h2 class="modal-title">Subir ${escapeHTML(t.nombre)}</h2>
      <div class="dias-label" style="margin-top:2px;">${w ? escapeHTML(w.nombre) + ' · ' + escapeHTML(fmtRut(w.rut)) : 'Documento de la empresa'} · ${escapeHTML(fmtPeriodo(state.mes))}</div>
      ${m.error ? `<div class="field-note" style="background:var(--st-atrasado-bg);color:var(--st-atrasado);margin-top:12px;">${escapeHTML(m.error)}</div>` : ''}
      ${existe ? '<div class="dias-label" style="margin-top:12px;">Ya hay un archivo de este mes. El nuevo pasará a ser el vigente y el anterior queda en el historial (nada se borra).</div>' : ''}
      <div class="form-field full" style="margin-top:14px;"><label>Archivo (PDF o imagen, máx. ${MAX_ARCHIVO_MB} MB)</label>
        <input type="file" id="mes-archivo" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/*" ${m.subiendo ? 'disabled' : ''}></div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="cerrarModalMes()" ${m.subiendo ? 'disabled' : ''}>Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="subirMes()" ${m.subiendo ? 'disabled' : ''}>${m.subiendo ? 'Subiendo…' : 'Subir'}</button>
      </div>
    </div>
  </div>`;
}
async function subirMes(){
  const m = state.modalMes;
  if(!m || m.subiendo || !state.puedeEscribir) return;
  const input = document.getElementById('mes-archivo');
  const archivo = input && input.files && input.files[0];
  const err = validarArchivo(archivo);
  if(err){ m.error = err; render(); return; }
  m.subiendo = true; m.error = null; render();
  try{
    await guardarDocMes(m.trabId, m.tipoId, state.mes, archivo);
    if(state.modalMes === m){ state.modalMes = null; render(); }
    await cargarMes();
    if(m.trabId && state.modalDocs && state.modalDocs.id === m.trabId) await cargarHistorial(m.trabId);     // la ficha abierta muestra el documento nuevo en su historial
    aviso('Documento subido.');
  }catch(e){
    if(state.modalMes !== m){ aviso('No se pudo subir el documento: ' + mensajeError(e), 3600); return; }
    m.subiendo = false;
    m.error = 'No se pudo subir: ' + mensajeError(e) + (e && e.archivoSubido ? ' (el archivo llegó pero no se registró; vuelve a intentarlo)' : '');
    render();
  }
}
async function abrirArchivo(path){
  if(!state.puedeEscribir){ aviso('Solo los editores pueden abrir los archivos.'); return; }
  const win = window.open('', '_blank');       // se abre antes de esperar para que el navegador no lo bloquee
  try{
    const r = await withTimeout(supabaseClient.storage.from(BUCKET).createSignedUrl(path, 120), 12000);
    if(r.error) throw r.error;
    const url = r.data && (r.data.signedUrl || r.data.signedURL);
    if(!url) throw new Error('No se obtuvo el enlace del archivo.');
    if(win) win.location.href = url; else window.location.href = url;
  }catch(e){
    if(win) win.close();
    aviso('No se pudo abrir el documento: ' + mensajeError(e), 3600);
  }
}
function verDocMes(id, esEmpresa){
  const doc = (esEmpresa ? state.docsEmpresa : state.docsMes).find(x => x.id === id);
  if(!doc){ aviso('No se encontró el documento.'); return; }
  abrirArchivo(doc.archivo_path);
}


/* --- Exportar documentos del mes (ZIP, una carpeta por trabajador) --- */
function nombreCarpeta(n){ return String(n || 'Sin nombre').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function nombreCortoTipo(t){
  const n = normTxt(t.nombre);
  if(n.startsWith('liquidaci')) return 'Liquidación';
  if(n.startsWith('cotizaci')) return 'Cotizaciones';
  return t.nombre;
}
function extArchivo(doc){
  const m = /\.([A-Za-z0-9]{2,5})$/.exec(doc.nombre_archivo || '') || /\.([A-Za-z0-9]{2,5})$/.exec(doc.archivo_path || '');
  return m ? m[1].toLowerCase() : 'pdf';
}
function planExportacion(){
  const tipos = tiposMensuales('trabajador');
  const usadas = {};
  const archivos = [], faltan = [];
  trabajadoresFiltrados().filter(w => w.activo).forEach(w => {
    let carpeta = nombreCarpeta(w.nombre);
    if(usadas[carpeta]) carpeta += ' (' + fmtRut(w.rut) + ')';
    usadas[carpeta] = true;
    const sin = [];
    tipos.forEach(t => {
      const d = docMes(w.id, t.id);
      if(d) archivos.push({ ruta: carpeta + '/' + nombreCortoTipo(t) + ' - ' + fmtPeriodo(state.mes) + '.' + extArchivo(d), path: d.archivo_path });
      else sin.push(nombreCortoTipo(t));
    });
    if(sin.length) faltan.push({ nombre: w.nombre, sin });
  });
  return { archivos, faltan, trabajadores: trabajadoresFiltrados().filter(w => w.activo).length };
}
function abrirExportar(){
  if(!state.puedeEscribir) return;
  if(state.cargandoMes){ aviso('Espera a que termine de cargar el mes.'); return; }
  state.modalExport = { plan: planExportacion(), estado: 'listo', hechos: 0, error: null, fallidos: [] };
  render();
}
function cerrarExportar(){ if(state.modalExport && state.modalExport.estado === 'trabajando') return; state.modalExport = null; render(); }
function actualizarExportar(){ if(state.modalExport) render(); }
function nombreZip(){
  const p = state.plataformas.find(x => String(x.id) === state.filtros.plataforma);
  return nombreCarpeta('Documentos - ' + (p ? p.nombre : 'Todas las plataformas') + ' - ' + fmtPeriodo(state.mes)) + '.zip';
}
async function descargarExportar(){
  const m = state.modalExport;
  if(!m || m.estado === 'trabajando' || !m.plan.archivos.length) return;
  if(typeof JSZip === 'undefined'){ m.error = 'No se pudo cargar el componente que arma el ZIP. Revisa tu conexión y recarga la página.'; render(); return; }
  m.estado = 'trabajando'; m.hechos = 0; m.error = null; m.fallidos = []; render();
  try{
    const zip = new JSZip();
    const cola = m.plan.archivos.slice();
    const trabajar = async () => {
      while(cola.length){
        const a = cola.shift();
        try{
          const r = await withTimeout(supabaseClient.storage.from(BUCKET).createSignedUrl(a.path, 300), 15000);
          if(r.error) throw r.error;
          const url = r.data && (r.data.signedUrl || r.data.signedURL);
          const resp = await withTimeout(fetch(url), 60000);
          if(!resp.ok) throw new Error('HTTP ' + resp.status);
          zip.file(a.ruta, await resp.blob());
        }catch(e){ m.fallidos.push(a.ruta); }
        m.hechos++;
        const el = document.getElementById('exp-avance');
        if(el) el.textContent = m.hechos + ' de ' + m.plan.archivos.length;
      }
    };
    await Promise.all([trabajar(), trabajar(), trabajar(), trabajar()]);
    if(m.fallidos.length === m.plan.archivos.length) throw new Error('No se pudo descargar ningún archivo.');
    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombreZip();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    m.estado = 'listo-descargado';
  }catch(e){
    m.estado = 'listo'; m.error = 'No se pudo armar el ZIP: ' + mensajeError(e);
  }
  if(state.modalExport === m) render();
}
function modalExportHTML(){
  const m = state.modalExport, pl_ = m.plan;

  const trabajando = m.estado === 'trabajando';
  return `

      ${m.error ? `<div class="field-note" style="background:var(--st-atrasado-bg);color:var(--st-atrasado);margin-top:12px;">${escapeHTML(m.error)}</div>` : ''}
      <div class="estado-box" style="margin-top:14px;">

        <div class="dias-label" style="margin-top:4px;">Liquidación y cotizaciones del mes, en una carpeta por trabajador.</div>
      </div>
      ${pl_.faltan.length ? `<div class="estado-box" style="margin-top:10px;"><b>Les falta algún documento (${pl_.faltan.length})</b><div class="dias-label" style="margin-top:4px;max-height:140px;overflow:auto;">${pl_.faltan.map(f => escapeHTML(f.nombre) + ': ' + escapeHTML(f.sin.join(', '))).join('<br>')}</div></div>` : ''}
      ${m.estado === 'listo-descargado' ? `<div class="field-note" style="margin-top:10px;">ZIP descargado.${m.fallidos.length ? ' No se pudieron incluir: ' + escapeHTML(m.fallidos.join(', ')) + '.' : ''}</div>` : ''}
      <div class="modal-actions" style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;align-items:center;">
        ${trabajando ? `<span class="dias-label">Descargando… <span id="exp-avance">${m.hechos} de ${pl_.archivos.length}</span></span>` : ''}
        <button type="button" class="btn btn-ghost" onclick="cerrarExportar()" ${trabajando ? 'disabled' : ''}>Cerrar</button>
        <button type="button" class="btn btn-primary" onclick="descargarExportar()" ${(trabajando || !pl_.archivos.length) ? 'disabled' : ''}>Descargar ZIP</button>
      </div>
    </div>
  </div>`;
}

/* --- Marcar en bloque --- */
function abrirBloque(){
  const tipos = {};
  tiposMensuales('trabajador').concat(tiposMensuales('empresa')).forEach(t => { tipos[t.id] = true; });
  state.modalBloque = { plataformaId: state.filtros.plataforma || '', tipos, paso: 1, saving: false, error: null };
  render();
}
function cerrarBloque(){ if(state.modalBloque && state.modalBloque.saving) return; state.modalBloque = null; render(); }
function calcularBloque(){
  const b = state.modalBloque, filas = [];
  if(!b || !b.plataformaId) return filas;
  const platId = Number(b.plataformaId);

/* --- Subir varios archivos: se emparejan por nombre y mes, y se revisa antes de subir --- */
const PALABRAS_NO_NOMBRE = new Set(['liquidacion', 'liquidaciones', 'sueldo', 'sueldos', 'remuneracion', 'remuneraciones', 'cotizacion', 'cotizaciones', 'previsional', 'previsionales', 'previred', 'transferencia', 'transferencias', 'comprobante', 'pago', 'pagos', 'nomina', 'de', 'del', 'la', 'el', 'y', 'mes', 'ano', 'copia', 'pdf', 'jpg', 'jpeg', 'png', 'webp']);
function normTxt(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function tokensTexto(s){ return normTxt(s).replace(/\.[a-z0-9]{2,4}$/, '').split(/[^a-z0-9]+/).filter(Boolean); }
function periodoDeNombre(nombre, anioPorDefecto){
  const base = normTxt(nombre);
  let m = /(?:^|[^0-9])(\d{1,2})[-_. ](20\d{2})(?:[^0-9]|$)/.exec(base);
  if(m && Number(m[1]) >= 1 && Number(m[1]) <= 12) return periodoISO(Number(m[2]), Number(m[1]));
  m = /(?:^|[^0-9])(20\d{2})[-_. ](\d{1,2})(?:[^0-9]|$)/.exec(base);
  if(m && Number(m[2]) >= 1 && Number(m[2]) <= 12) return periodoISO(Number(m[1]), Number(m[2]));
  const toks = tokensTexto(nombre);
  const mes = toks.find(t => MESES.includes(t));
  if(mes){
    const y = toks.find(t => /^20\d{2}$/.test(t));
    return periodoISO(y ? Number(y) : anioPorDefecto, MESES.indexOf(mes) + 1);
  }
  return null;
}
function tipoDeNombre(toks){
  const tipos = tiposMensuales('trabajador');
  if(toks.some(t => /^liquidaci/.test(t) || t === 'sueldo' || t === 'sueldos')) return tipos.find(t => normTxt(t.nombre).includes('liquid')) || null;
  if(toks.some(t => /^cotizaci/.test(t) || t === 'previred')) return tipos.find(t => normTxt(t.nombre).includes('cotiz')) || null;
  return null;
}
// Trabajadores activos cuyo nombre contiene TODAS las palabras de nombre del archivo (en cualquier orden). Si hay uno idéntico, gana.
function candidatosPorNombre(palabras){
  if(palabras.length < 2) return [];
  const res = [];
  for(const w of state.trabajadores){
    if(!w.activo) continue;
    const tw = new Set(tokensTexto(w.nombre));
    if(palabras.every(p => tw.has(p))) res.push({ w, exacto: tw.size === palabras.length });
  }
  const exactos = res.filter(r => r.exacto);
  return (exactos.length ? exactos : res).map(r => r.w.id);
}
function analizarNombreArchivo(file, m){
  const toks = tokensTexto(file.name);
  const palabras = toks.filter(t => !PALABRAS_NO_NOMBRE.has(t) && !MESES.includes(t) && !/^\d+$/.test(t) && t.length >= 2);
  const cand = candidatosPorNombre(palabras);
  const tipo = tipoDeNombre(toks);
  const per = periodoDeNombre(file.name, Number(m.periodo.slice(0, 4)));
  return {
    file, errorArchivo: validarArchivo(file),
    cand, trabId: cand.length === 1 ? cand[0] : null,
    tipoId: tipo ? tipo.id : (m.tipoId ? Number(m.tipoId) : null), fijoTipo: !!tipo,
    periodo: per || m.periodo, fijoPeriodo: !!per,
    res: null, msg: ''
  };
}
function estadoItemMasiva(it){
  if(it.res) return it.res;                       // subiendo | subido | error
  if(it.errorArchivo) return 'archivo';
  if(!it.trabId) return it.cand.length > 1 ? 'ambiguo' : 'sin';
  if(!it.tipoId) return 'sintipo';
  return 'listo';
}

  render();
}

async function subirMasiva(){
  const m = state.modalMasiva;
  if(!m || m.subiendo || !state.puedeEscribir) return;
  m.items.forEach(it => { if(it.res === 'error') it.res = null; });
  const lista = m.items.filter(it => estadoItemMasiva(it) === 'listo');
  if(!lista.length) return;
  m.subiendo = true; m.error = null; render();
  let fallos = 0;
  for(const it of lista){
    it.res = 'subiendo'; it.msg = '';
    render();
    try{
      await guardarDocMes(it.trabId, it.tipoId, it.periodo, it.file);
      it.res = 'subido';
    }catch(e){
      it.res = 'error'; fallos++;
      it.msg = mensajeError(e) + (e && e.archivoSubido ? ' (el archivo llegó pero no se registró)' : '');
    }
  }
  m.subiendo = false; m.hecho = true;
  if(fallos) m.error = pl(fallos, 'archivo no se pudo subir', 'archivos no se pudieron subir') + ': revisa el detalle en cada fila. Los demás sí quedaron guardados.';
  render();
  await cargarMes();
  aviso(fallos ? 'Subida terminada con errores.' : 'Archivos subidos.', 3600);
}

async function agregarRol(){

async function agregarTipo(){

async function toggleObligatorio(tipoId, marcado){
  // Obligatorio para todos los roles: se guarda una fila por rol (así no hace falta cambiar la base de datos).
  try{
    if(!state.roles.length) throw new Error('Crea al menos un rol antes de marcar documentos obligatorios.');
    if(marcado){
      const filas = state.roles.filter(r => !state.requeridos.some(x => x.rol_faena_id === r.id && x.tipo_documento_id === tipoId))
        .map(r => ({ rol_faena_id: r.id, tipo_documento_id: tipoId }));
      if(filas.length){
        const r = await supabaseClient.from('documentos_requeridos_por_rol').insert(filas);
        if(r.error) throw r.error;
        filas.forEach(f => state.requeridos.push(f));
      }
    }else{
      const r = await supabaseClient.from('documentos_requeridos_por_rol').delete().eq('tipo_documento_id', tipoId);
      if(r.error) throw r.error;
      state.requeridos = state.requeridos.filter(x => x.tipo_documento_id !== tipoId);
    }
    refrescarVistas();
  }catch(e){
    aviso('No se pudo guardar el cambio: ' + mensajeError(e), 3600);
    render();
  }
}
/* --- Editar / eliminar elementos de catálogo --- */
const CAT = {
  roles:       { tabla: 'roles_faena',         lista: () => state.roles,       singular: 'rol',               titulo: 'Editar rol' },
  tipos:       { tabla: 'tipos_documento',     lista: () => state.tipos,       singular: 'tipo de documento', titulo: 'Editar tipo de documento' },

};
function pl(n, uno, varios){ return n + ' ' + (n === 1 ? uno : varios); }
function chipBtn(tabla, id){

}
// Qué depende de este elemento y si eso impide eliminarlo.
function usoCat(tabla, id){
  if(tabla === 'roles'){
    const ws = state.trabajadores.filter(w => w.rol_faena_id === id);
    const act = ws.filter(w => w.activo).length;
    const req = state.requeridos.filter(x => x.rol_faena_id === id).length;
    if(ws.length) return { bloquea: true, detalle: `${pl(ws.length, 'trabajador tiene', 'trabajadores tienen')} este rol (${pl(act, 'activo', 'activos')}). Para eliminarlo, primero reasígnalos a otro rol. Mientras tanto puedes cambiarle el nombre.` };
    return { bloquea: false, detalle: req ? `Ningún trabajador lo tiene. Al eliminarlo se quitan sus ${pl(req, 'documento requerido', 'documentos requeridos')}.` : 'Ningún trabajador tiene este rol.' };
  }
  if(tabla === 'plataformas'){
    const rows = state.tp.filter(x => x.plataforma_id === id);
    const act = rows.filter(x => x.activo).length;
    if(rows.length) return { bloquea: true, detalle: `${pl(act, 'trabajador activo', 'trabajadores activos')} y ${pl(rows.length - act, 'registro histórico', 'registros históricos')} en esta plataforma. El historial se conserva, por eso no se puede eliminar. Puedes cambiarle el nombre.` };
    return { bloquea: false, detalle: 'Ningún trabajador ha estado en esta plataforma.' };
  }
  const req = state.requeridos.filter(x => x.tipo_documento_id === id).length;
  return { bloquea: false, detalle: req
    ? `Lo exigen ${pl(req, 'rol', 'roles')}; al eliminarlo se quita de esos requisitos. Si ya hay documentos cargados de este tipo, no se podrá eliminar.`
    : 'Ningún rol lo exige. Si ya hay documentos cargados de este tipo, no se podrá eliminar.' };
}

  const venceHTML = m.tabla === 'tipos' ? `

        <select id="cat-frec">${['unica', 'mensual', 'vence'].map(k => `<option value="${k}" ${frecSel === k ? 'selected' : ''}>${({ unica: 'Se sube una sola vez', mensual: 'Se sube todos los meses', vence: 'Tiene fecha de vencimiento' })[k]}</option>`).join('')}</select>
      </div>
      <div class="form-field">
        <label>De quién es</label>
        <select id="cat-ambito"><option value="trabajador" ${ambSel === 'trabajador' ? 'selected' : ''}>De cada trabajador</option><option value="empresa" ${ambSel === 'empresa' ? 'selected' : ''}>De la empresa</option></select>
      </div>
      <div class="form-field full"><span class="dias-label">Cambiarlo afecta cómo se controla este documento. Los ya cargados se conservan.</span></div>` :
    (m.tabla === 'plataformas' ? `
      <div class="form-field full">
        <label>Día límite de carga (del mes siguiente)</label>
        <input type="number" id="cat-plazo" min="1" max="31" value="${escapeHTML(d ? d.plazo : item.plazo_dia)}">
        <span class="dias-label">Ej.: 16 significa que lo de septiembre debe estar cargado el 16 de octubre.</span>
      </div>` : '');
  const eliminarHTML = uso.bloquea ? '' : `
      <div id="del-paso1" style="margin-top:10px;"><button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('del-paso1').style.display='none';document.getElementById('del-paso2').style.display='block';">Eliminar ${escapeHTML(c.singular)}…</button></div>
      <div id="del-paso2" style="display:none;margin-top:10px;">
        <b>¿Eliminar «${escapeHTML(item.nombre)}»?</b> Esta acción no se puede deshacer.
        <div style="margin-top:10px;display:flex;gap:10px;">
          <button type="button" class="btn btn-danger btn-sm" onclick="eliminarCat()" ${state.saving ? 'disabled' : ''}>Sí, eliminar</button>
          <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('del-paso2').style.display='none';document.getElementById('del-paso1').style.display='block';">Cancelar</button>
        </div>
      </div>`;
  return `
  <div class="modal-backdrop">
    <div class="modal" style="max-width:480px;">
      <button type="button" class="modal-close" onclick="cerrarModalCat()" aria-label="Cerrar">×</button>
      <h2 class="modal-title">${escapeHTML(c.titulo)}</h2>
      ${state.modalCatError ? `<div class="field-note" style="background:var(--st-atrasado-bg);color:var(--st-atrasado);margin-top:12px;">${escapeHTML(state.modalCatError)}</div>` : ''}
      <div class="form-grid">
        <div class="form-field full"><label>Nombre</label><input type="text" id="cat-nombre" value="${escapeHTML(d ? d.nombre : item.nombre)}" onkeydown="if(event.key==='Enter') guardarCat()"></div>
        ${venceHTML}
      </div>
      <div class="estado-box">
        <div class="dias-label">${escapeHTML(uso.detalle)}</div>
        ${eliminarHTML}
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="cerrarModalCat()">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarCat()" ${state.saving ? 'disabled' : ''}>${state.saving ? 'Guardando…' : 'Guardar cambios'}</button>
      </div>
    </div>
  </div>`;
}
function abrirModalCat(tabla, id){ state.modalCat = { tabla, id, draft: null }; state.modalCatError = null; render(); }
function cerrarModalCat(){ state.modalCat = null; state.modalCatError = null; state.saving = false; render(); }
async function guardarCat(){
  if(state.saving) return;
  const m = state.modalCat, c = CAT[m.tabla];
  const nombre = val('cat-nombre').trim().replace(/\s+/g, ' ');
  m.draft = { nombre: val('cat-nombre'), frecuencia: val('cat-frec'), ambito: val('cat-ambito'), plazo: val('cat-plazo') };
  if(!nombre){ state.modalCatError = 'Escribe un nombre.'; render(); return; }
  const cambios = { nombre };
  if(m.tabla === 'tipos'){
    cambios.frecuencia = m.draft.frecuencia; cambios.ambito = m.draft.ambito; cambios.vence = m.draft.frecuencia === 'vence';
  }
  if(m.tabla === 'plataformas'){
    const plazo = parseInt(m.draft.plazo, 10);
    if(!(plazo >= 1 && plazo <= 31)){ state.modalCatError = 'El día límite debe estar entre 1 y 31.'; render(); return; }
    cambios.plazo_dia = plazo;
  }
  state.saving = true; state.modalCatError = null; render();
  try{
    const r = await withTimeout(supabaseClient.from(c.tabla).update(cambios).eq('id', m.id).select('id'), 10000);
    if(r.error) throw r.error;
    if(!r.data || !r.data.length) throw new Error('No se aplicó el cambio (revisa tus permisos).');
    state.modalCat = null; state.saving = false;
    await recargar();
    aviso('Cambios guardados.');
  }catch(e){
    state.saving = false; state.modalCatError = 'No se pudo guardar: ' + mensajeError(e); render();
  }
}
async function eliminarCat(){
  if(state.saving) return;
  const m = state.modalCat, c = CAT[m.tabla];
  const uso = usoCat(m.tabla, m.id);
  if(uso.bloquea){ state.modalCatError = uso.detalle; render(); return; }
  state.saving = true; state.modalCatError = null; render();
  try{
    if(m.tabla === 'tipos'){
      // Los documentos cargados nunca se borran: si hay alguno de este tipo, no se elimina.
      const n = await withTimeout(supabaseClient.from('documentos_trabajador').select('id', { count: 'exact', head: true }).eq('tipo_documento_id', m.id), 10000);
      if(n.error) throw n.error;
      if(n.count > 0) throw new Error(`ya hay ${pl(n.count, 'documento cargado', 'documentos cargados')} de este tipo. Los documentos nunca se borran, así que el tipo tampoco. Puedes cambiarle el nombre.`);
    }
    if(m.tabla === 'roles' || m.tabla === 'tipos'){
      const col = m.tabla === 'roles' ? 'rol_faena_id' : 'tipo_documento_id';
      const q = await withTimeout(supabaseClient.from('documentos_requeridos_por_rol').delete().eq(col, m.id), 10000);
      if(q.error) throw q.error;
    }
    const r = await withTimeout(supabaseClient.from(c.tabla).delete().eq('id', m.id).select('id'), 10000);
    if(r.error) throw r.error;
    if(!r.data || !r.data.length) throw new Error('No se aplicó el cambio (revisa tus permisos).');
    if(m.tabla === 'roles'){ if(state.filtros.rol === String(m.id)) state.filtros.rol = ''; }
    if(m.tabla === 'plataformas' && state.filtros.plataforma === String(m.id)) state.filtros.plataforma = '';
    state.modalCat = null; state.saving = false;
    await recargar();
    aviso('Eliminado.');
  }catch(e){
    state.saving = false; state.modalCatError = 'No se pudo eliminar: ' + mensajeError(e);
    await recargar();
  }
}

    <div class="chip-list">${state.tipos.length ? state.tipos.map(t => `<span class="chip">${escapeHTML(t.nombre)} <span class="badge ${t.frecuencia === 'vence' ? 'badge-warn' : (t.frecuencia === 'mensual' ? 'badge-plat' : 'badge-off')}">${escapeHTML(ETIQ_FREC[t.frecuencia] || '')}</span>${t.ambito === 'empresa' ? ' <span class="badge badge-ok">Empresa</span>' : ''}${chipBtn('tipos', t.id)}</span>`).join('') : '<span class="dias-label">Aún no hay tipos.</span>'}</div>

    <div class="chip-list">${state.plataformas.length ? state.plataformas.map(p => `<span class="chip">${escapeHTML(p.nombre)} <span class="dias-label">día ${p.plazo_dia}</span>${chipBtn('plataformas', p.id)}</span>`).join('') : '<span class="dias-label">Aún no hay plataformas.</span>'}</div>
  </div>

  <div class="section-card">
    <h3>Obligatorios al ingresar</h3>

    ${state.tipos.filter(t => t.ambito === 'trabajador' && t.frecuencia !== 'mensual').length ? `<div class="checks-box">${state.tipos.filter(t => t.ambito === 'trabajador' && t.frecuencia !== 'mensual').map(t =>
      `<label class="check-row"><input type="checkbox" ${esObligatorio(t.id) ? 'checked' : ''} ${ed ? '' : 'disabled'} onchange="toggleObligatorio(${t.id}, this.checked)"> ${escapeHTML(t.nombre)} <span class="dias-label">(${escapeHTML(ETIQ_FREC[t.frecuencia] || '')})</span></label>`).join('')}</div>` : '<span class="dias-label">Crea tipos de documento para poder marcarlos.</span>'}

function sinAccesoHTML(){
  return `
  <div class="center-loading" style="flex-direction:column;gap:12px;">
    <p style="font-family:var(--font-display);font-size:20px;margin:0;">Sin acceso</p>
    <p class="page-sub" style="max-width:340px;text-align:center;">Tu cuenta no tiene acceso a Subcontrataciones. Si lo necesitas, pídelo a quien administra el sistema.</p>
    <a class="link-btn" href="./index.html">Volver al inicio</a>
    <button type="button" class="link-btn" onclick="handleLogout()">Cerrar sesión</button>
  </div>`;
}
function setTab(t){
  state.tab = t; render();
  if(t === 'trabajadores' || t === 'empresa') cargarMes();
}

      ${state.plataformas.map(p => `<option value="${p.id}" ${f.plataforma === String(p.id) ? 'selected' : ''}>${escapeHTML(p.nombre)}</option>`).join('')}

      <option value="m_pend" ${f.doc === 'm_pend' ? 'selected' : ''}>Del mes: con pendientes</option>
      <option value="m_atras" ${f.doc === 'm_atras' ? 'selected' : ''}>Del mes: plazo vencido</option>
    </select>

function render(){
  const app = document.getElementById('app');
  if(!app) return;
  if(!state.session){ app.innerHTML = loginHTML(); return; }
  if(state.cargando){ app.innerHTML = '<div class="center-loading">Conectando con la base de datos…</div>'; return; }
  if(state.loadError && !state.acceso){
    app.innerHTML = `<div class="center-loading" style="flex-direction:column;gap:12px;"><p class="page-sub" style="max-width:380px;text-align:center;">${escapeHTML(state.loadError)}</p><button type="button" class="btn btn-primary" onclick="arrancar()">Reintentar</button></div>`;
    return;
  }
  if(!state.acceso){ app.innerHTML = sinAccesoHTML(); return; }
  app.innerHTML = mainHTML();
}

async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  state.session = session;
  if(session){ await arrancar(); } else { state.cargando = false; render(); }
}
init();
supabaseClient.auth.onAuthStateChange((event)=>{
  if(event === 'SIGNED_OUT'){ limpiarEstado(); state.cargando = false; render(); }
});
