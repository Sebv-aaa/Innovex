<script>

const SUPABASE_URL = 'https://wncejgicemnaneptrrsq.supabase.co';

/* ============================================================
   UTILIDADES COMPARTIDAS
   ============================================================ */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDaysISO(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysSince(iso){
  if(!iso) return 0;
  const d = new Date(iso+'T00:00:00'); const t = new Date(); t.setHours(0,0,0,0);
  return Math.max(0, Math.round((t-d)/86400000));
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.getDate()+' '+MESES[d.getMonth()];
}
function fmtUSD(n){ if(n===null||n===undefined||n==='') return '—'; return Number(n).toLocaleString('es-CL'); }
function fmtCLP(n){ if(n===null||n===undefined||n==='') return '—'; return Math.round(n).toLocaleString('es-CL'); }
function escapeHTML(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uidPedido(){ return 'p'+Date.now()+Math.random().toString(16).slice(2,7); }
function uidInsumo(){ return 'i'+Date.now()+Math.random().toString(16).slice(2,7); }
function withTimeout(promise, ms){
  return Promise.race([ promise, new Promise((_, reject)=> setTimeout(()=> reject(new Error('La operación tardó demasiado')), ms)) ]);
}
function parseJSONLoose(text){
  try{ return JSON.parse(text.replace(/```json/gi,'').replace(/```/g,'').trim()); }
  catch(e){ return {}; }
}

/* ============================================================
   API — PEDIDOS
   ============================================================ */
async function apiGetPedidos(){
  const { data, error } = await withTimeout(supabaseClient.from('pedidos').select('*').order('fecha_registro', { ascending:false }), 10000);
  if(error) throw new Error('Error al leer los pedidos: ' + error.message);
  return data;
}
async function apiCreatePedido(pedido){
  const { error } = await withTimeout(supabaseClient.from('pedidos').insert(pedido), 10000);
  if(error) throw new Error('Error al crear el pedido: ' + error.message);
}
async function apiUpdatePedido(id, updates){
  const { error } = await withTimeout(supabaseClient.from('pedidos').update(updates).eq('id', id), 10000);
  if(error) throw new Error('Error al actualizar el pedido: ' + error.message);
}
async function apiDeletePedido(id){
  const { error } = await withTimeout(supabaseClient.from('pedidos').delete().eq('id', id), 10000);
  if(error) throw new Error('Error al eliminar el pedido: ' + error.message);
}

/* ============================================================
   IA (Claude API vía claude-proxy) — COMPARTIDO
   ============================================================ */
async function callClaude(systemPrompt, userMessage){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session) throw new Error('Sesión no válida. Vuelve a iniciar sesión.');
  const response = await fetch(CLAUDE_PROXY_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + session.access_token },
    body: JSON.stringify({ system: systemPrompt, message: userMessage })
  });
  const data = await response.json();
  if(!data || !data.content){ throw new Error((data && data.error && data.error.message) || 'Error de API'); }
  return data.content.map(b=>b.text||'').join('\n');
}

const EXTRACT_SYSTEM_PROMPT = `Eres un extractor de datos para el sistema de seguimiento de pedidos de Innovex.
A partir del texto de un correo o mensaje de confirmación de envío, extrae los datos del pedido.
Responde ÚNICAMENTE con un objeto JSON, sin texto adicional, sin explicaciones, sin backticks de markdown.
Usa exactamente estas claves:
- proveedor (string o null)
- monto (número, sin símbolo ni separadores de miles, o null)
- moneda (uno de "USD" o "CLP" según el símbolo o contexto del texto; si no es claro, usa "USD")
- numero_seguimiento (string o null)
- courier (uno de "DHL", "UPS", "MercadoLibre", "Otro", o null si no se identifica con certeza)
- fecha_estimada (formato YYYY-MM-DD, o null si no se menciona)
- destino ("Puerto Montt", "Valdivia" o null si no se menciona)
Si un dato no aparece explícitamente en el texto, usa null. No inventes información.`;

const AGENTE_SYSTEM_PROMPT = `Genera un resumen breve y formal en español de este pedido de compra internacional, listo para enviar por correo a un agente de aduana externo que gestionará el trámite.
Incluye: proveedor, monto, número de seguimiento, empresa transportista, destino y fecha estimada de llegada.
Formato de texto plano, listo para copiar y pegar, sin markdown, sin encabezados de correo (sin "Asunto:" ni "Estimado/a").`;

const ESTADO_DESDE_TEXTO_PROMPT = `Eres un asistente que interpreta el texto de una página de seguimiento de envíos (DHL, UPS, MercadoLibre, u otra) que un usuario pegó tal como lo vio en pantalla, y sugiere a cuál de estos estados corresponde en el sistema de Innovex: "En proceso", "En tránsito", "En aduana", "En destino", "Recibido".

Responde ÚNICAMENTE con un objeto JSON, sin texto adicional, sin backticks. Usa exactamente estas claves:
- estado_sugerido (uno de los cinco valores exactos de arriba, o null si el texto no permite determinarlo con confianza)
- razon (una frase breve en español explicando por qué, o qué faltó si no se pudo determinar)

Si el texto pegado no parece ser de una página de seguimiento o no tiene información de estado clara, responde con estado_sugerido: null.`;

function trackingUrl(p){
  if(!p.numero_seguimiento) return null;
  const num = encodeURIComponent(p.numero_seguimiento);
  if(p.courier === 'DHL') return `https://www.dhl.com/cl-es/home/rastreo.html?tracking-id=${num}`;
  if(p.courier === 'UPS') return `https://www.ups.com/track?loc=es_CL&tracknum=${num}`;
  return null;
}
function computePedidoStats(){
  const activos = state.pedidos.filter(p=>p.estado!=='Recibido').length;
  const atrasados = state.pedidos.filter(p=>p.estado!=='Recibido' && daysSince(p.fecha_ultima_actualizacion)>=5).length;
  const conAgente = state.pedidos.filter(p=>p.agente_aduanero).length;
  const pendientesRevision = state.pedidos.filter(p=>p.pendiente_revision).length;
  return { activos, atrasados, conAgente, pendientesRevision };
}
function getFilteredPedidos(){
  const { search, destino, estado } = state.pedidosFilters;
  return state.pedidos.filter(p=>{
    if(destino!=='Todos' && p.destino!==destino) return false;
    if(estado!=='Todos' && p.estado!==estado) return false;
    if(search){
      const s = search.toLowerCase();
      const hay = (p.proveedor||'').toLowerCase().includes(s) || (p.numero_seguimiento||'').toLowerCase().includes(s);
      if(!hay) return false;
    }
    return true;
  });
}

      ${p.agente_aduanero ? '<span class="badge badge-agente">Agente aduanero</span>' : ''}

      <select class="estado-select" style="--sel-color:${meta.color}" onchange="updateEstado('${p.id}', this.value)">
        ${ESTADOS.map(e=>`<option value="${e}" ${e===p.estado?'selected':''}>${e}</option>`).join('')}
      </select>
      ${atrasado

function openPedidoModal(){ state.showPedidoModal = true; render(); validatePedidoForm(); }
function closePedidoModal(){ state.showPedidoModal = false; render(); }
function isPedidoFormValid(){
  const proveedor = document.getElementById('f-proveedor').value.trim();
  const monto = parseFloat(document.getElementById('f-monto').value);
  const tracking = document.getElementById('f-tracking').value.trim();
  const courier = document.getElementById('f-courier').value;
  const destino = document.getElementById('f-destino').value;
  const fecha = document.getElementById('f-fecha').value;
  const moneda = document.getElementById('f-moneda').value;
  let tcOk = true;
  if(moneda === 'CLP'){ const tc = parseFloat(document.getElementById('f-tc').value); tcOk = !isNaN(tc) && tc > 0; }
  return proveedor !== '' && !isNaN(monto) && monto > 0 && tracking !== '' && courier !== '' && destino !== '' && fecha !== '' && tcOk;
}
function updateMontoPreview(){
  const moneda = document.getElementById('f-moneda').value;
  const monto = parseFloat(document.getElementById('f-monto').value);
  const tc = parseFloat(document.getElementById('f-tc').value) || DEFAULT_TC;
  const preview = document.getElementById('monto-preview');
  if(!preview) return;
  if(isNaN(monto)){ preview.textContent = ''; return; }
  if(moneda==='USD'){ preview.textContent = '≈ CLP $' + fmtCLP(monto*tc); }
  else{ preview.textContent = '≈ US$ ' + fmtUSD(+(monto/tc).toFixed(2)); }
}
function handleMonedaChange(){
  const moneda = document.getElementById('f-moneda').value;
  document.getElementById('tc-row').style.display = moneda==='CLP' ? 'block' : 'none';
  validatePedidoForm();
}
function validatePedidoForm(){
  updateMontoPreview();
  const btn = document.getElementById('btn-guardar');
  const hint = document.getElementById('form-hint');
  if(!btn) return;
  const ok = isPedidoFormValid();
  btn.disabled = !ok;
  if(hint) hint.style.display = ok ? 'none' : 'block';
}
function showTab(tab){
  document.getElementById('tab-manual').style.display = tab==='manual' ? 'grid' : 'none';
  document.getElementById('tab-pegar').style.display = tab==='pegar' ? 'block' : 'none';
  document.getElementById('tabbtn-manual').classList.toggle('active', tab==='manual');
  document.getElementById('tabbtn-pegar').classList.toggle('active', tab==='pegar');
}
async function handleExtract(){
  const btn = document.getElementById('btn-extract');
  const status = document.getElementById('extract-status');
  const text = document.getElementById('f-pegado').value.trim();
  if(!text){ status.textContent = 'Pega primero el texto del correo o mensaje.'; return; }
  btn.disabled = true; status.textContent = 'Extrayendo datos con IA…';
  try{
    const raw = await callClaude(EXTRACT_SYSTEM_PROMPT, text);
    const data = parseJSONLoose(raw);
    if(data.proveedor) document.getElementById('f-proveedor').value = data.proveedor;
    if(data.moneda === 'CLP' || data.moneda === 'USD'){ document.getElementById('f-moneda').value = data.moneda; handleMonedaChange(); }
    if(data.monto) document.getElementById('f-monto').value = data.monto;
    if(data.numero_seguimiento) document.getElementById('f-tracking').value = data.numero_seguimiento;
    if(data.courier && COURIERS.includes(data.courier)) document.getElementById('f-courier').value = data.courier;
    if(data.destino && DESTINOS.includes(data.destino)) document.getElementById('f-destino').value = data.destino;
    if(data.fecha_estimada) document.getElementById('f-fecha').value = data.fecha_estimada;
    validatePedidoForm();
    showTab('manual');
    document.getElementById('extract-note').style.display = 'block';
    status.textContent = '';
  }catch(e){
    status.textContent = 'No se pudo extraer la información. Puedes completar los datos manualmente.';
  }
  btn.disabled = false;
}
async function handleGuardar(){
  const errorEl = document.getElementById('form-error');
  errorEl.style.display = 'none';
  if(!isPedidoFormValid()){
    errorEl.textContent = 'No se puede guardar: completa todos los campos.';
    errorEl.style.display = 'block';
    validatePedidoForm();
    return;
  }
  const proveedor = document.getElementById('f-proveedor').value.trim();
  const submitBtn = document.getElementById('btn-guardar');
  submitBtn.disabled = true; submitBtn.textContent = 'Guardando…';
  try{
    const moneda = document.getElementById('f-moneda').value;
    const montoInput = parseFloat(document.getElementById('f-monto').value);
    const tc = parseFloat(document.getElementById('f-tc').value) || DEFAULT_TC;
    let monto_usd = null, monto_clp = null;
    if(!isNaN(montoInput)){
      if(moneda === 'CLP'){ monto_clp = montoInput; monto_usd = +(montoInput/tc).toFixed(2); }
      else{ monto_usd = montoInput; monto_clp = Math.round(montoInput*tc); }
    }
    const pedido = {
      id: uidPedido(), proveedor,
      monto_usd, monto_clp, moneda_ingreso: moneda, tipo_cambio: tc,
      numero_seguimiento: document.getElementById('f-tracking').value.trim() || null,
      courier: document.getElementById('f-courier').value,
      destino: document.getElementById('f-destino').value,
      fecha_estimada: document.getElementById('f-fecha').value || null,
      estado: 'En proceso', fecha_registro: todayISO(), fecha_ultima_actualizacion: todayISO(),
      agente_aduanero: !!(monto_usd && monto_usd > 3000), pendiente_revision: false
    };
    await apiCreatePedido(pedido);
    state.pedidos.unshift(pedido);
    state.showPedidoModal = false;
    state.toast = 'Pedido guardado — ' + proveedor;
    render();
    setTimeout(()=>{ state.toast = null; render(); }, 2600);
  }catch(err){
    submitBtn.disabled = false; submitBtn.textContent = 'Guardar pedido';
    errorEl.textContent = 'Ocurrió un error al guardar: ' + (err && err.message ? err.message : 'error desconocido') + '. Intenta nuevamente.';
    errorEl.style.display = 'block';
  }
}
async function updateEstado(id, value){
  const p = state.pedidos.find(x=>x.id===id);
  if(!p) return;
  const prevEstado = p.estado, prevFecha = p.fecha_ultima_actualizacion;
  p.estado = value; p.fecha_ultima_actualizacion = todayISO();
  render();
  try{ await apiUpdatePedido(id, { estado: value, fecha_ultima_actualizacion: p.fecha_ultima_actualizacion }); }
  catch(e){
    p.estado = prevEstado; p.fecha_ultima_actualizacion = prevFecha;
    state.toast = 'No se pudo guardar el cambio de estado. Intenta de nuevo.';
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 3200);
  }
}
async function markAsReviewed(id){
  const p = state.pedidos.find(x=>x.id===id);
  if(!p) return;
  p.pendiente_revision = false;
  render();
  try{ await apiUpdatePedido(id, { pendiente_revision: false }); }
  catch(e){
    p.pendiente_revision = true;
    state.toast = 'No se pudo guardar el cambio. Intenta de nuevo.';
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 3200);
  }
}
function askDeletePedidoConfirm(id){ state.deletePedidoConfirmId = id; renderPedidosList(); }
function cancelDeletePedidoConfirm(){ state.deletePedidoConfirmId = null; renderPedidosList(); }
async function confirmDeletePedido(id){

}
async function handleAgenteSummary(id){

  state.agenteSummaryModal = { pedidoId:id, text:null, loading:true };

function closeAgenteModal(){ state.agenteSummaryModal = null; render(); }
async function copyAgenteText(){
  const t = state.agenteSummaryModal && state.agenteSummaryModal.text;
  if(!t) return;
  let ok = false;
  try{ await navigator.clipboard.writeText(t); ok = true; }
  catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok = document.execCommand('copy'); document.body.removeChild(ta);
    }catch(e2){ ok = false; }
  }
  const el = document.getElementById('copy-feedback');
  if(el) el.textContent = ok ? 'Copiado ✓' : 'No se pudo copiar automáticamente — selecciona el texto y cópialo manualmente.';
}
function openActualizarEstadoModal(id){ state.actualizarEstadoModal = { pedidoId:id, texto:'', loading:false, resultado:null, error:null }; render(); }
function closeActualizarEstadoModal(){ state.actualizarEstadoModal = null; render(); }
async function handleAnalizarEstado(){
  const texto = document.getElementById('estado-pegado').value.trim();
  if(!texto){ state.actualizarEstadoModal.error = 'Pega primero el texto que ves en la página de seguimiento.'; render(); return; }
  state.actualizarEstadoModal.texto = texto; state.actualizarEstadoModal.loading = true;
  state.actualizarEstadoModal.error = null; state.actualizarEstadoModal.resultado = null;
  render();
  try{
    const raw = await callClaude(ESTADO_DESDE_TEXTO_PROMPT, texto);
    const data = parseJSONLoose(raw);
    if(!data.estado_sugerido || !ESTADOS.includes(data.estado_sugerido)){ state.actualizarEstadoModal.error = data.razon || 'No se pudo determinar un estado a partir de ese texto.'; }
    else{ state.actualizarEstadoModal.resultado = data; }
  }catch(e){ state.actualizarEstadoModal.error = 'No se pudo analizar el texto. Intenta nuevamente.'; }
  state.actualizarEstadoModal.loading = false;
  render();
}
async function aplicarEstadoSugerido(){
  const modal = state.actualizarEstadoModal;
  if(!modal || !modal.resultado) return;
  const id = modal.pedidoId, nuevoEstado = modal.resultado.estado_sugerido;
  closeActualizarEstadoModal();
  await updateEstado(id, nuevoEstado);
}

/* ============================================================
   INVENTARIO — lógica de negocio
   ============================================================ */
function computeInsumoStats(){
  const totalInsumos = state.insumos.length;
  const unidadesTotales = state.insumos.reduce((sum,i)=> sum + (parseFloat(i.cantidad)||0), 0);
  const sinActualizar = state.insumos.filter(i=> daysSince(i.fecha_ultima_actualizacion) >= 90).length;
  return { totalInsumos, unidadesTotales, sinActualizar };
}
function getFilteredInsumos(){
  const { search, ubicacion, categoria } = state.insumosFilters;
  return state.insumos.filter(i=>{
    if(ubicacion!=='Todos' && i.ubicacion!==ubicacion) return false;
    if(categoria!=='Todas' && (i.categoria||'')!==categoria) return false;
    if(search){ const s = search.toLowerCase(); if(!(i.nombre||'').toLowerCase().includes(s)) return false; }
    return true;
  });
}
function categoriasExistentes(){
  const set = new Set();
  state.insumos.forEach(i=>{ if(i.categoria) set.add(i.categoria); });
  return Array.from(set).sort();
}

function openInsumoModal(editId){
  state.editInsumoId = editId || null;

  render();

  if(editId){
    const item = state.insumos.find(i=>i.id===editId);
    if(item){

function isInsumoFormValid(){
  const nombre = document.getElementById('f-nombre').value.trim();
  const ubicacion = document.getElementById('f-ubicacion').value;
  const cantidad = document.getElementById('f-cantidad').value;
  return nombre !== '' && ubicacion !== '' && cantidad !== '' && !isNaN(parseFloat(cantidad)) && parseFloat(cantidad) >= 0;
}
function validateInsumoForm(){
  const btn = document.getElementById('btn-guardar-item');
  const hint = document.getElementById('form-hint');
  if(!btn) return;
  const ok = isInsumoFormValid();
  btn.disabled = !ok;
  if(hint) hint.style.display = ok ? 'none' : 'block';
}
async function handleGuardarItem(){
  const errorEl = document.getElementById('form-error');
  errorEl.style.display = 'none';
  if(!isInsumoFormValid()){ errorEl.textContent = 'No se puede guardar: completa nombre, ubicación y cantidad.'; errorEl.style.display = 'block'; return; }
  const btn = document.getElementById('btn-guardar-item');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try{
    const datos = {
      nombre: document.getElementById('f-nombre').value.trim(),
      categoria: document.getElementById('f-categoria').value.trim() || null,
      ubicacion: document.getElementById('f-ubicacion').value,
      cantidad: parseFloat(document.getElementById('f-cantidad').value),
      unidad: document.getElementById('f-unidad').value.trim() || null,
      notas: document.getElementById('f-notas').value.trim() || null,
      fecha_ultima_actualizacion: todayISO()
    };
    if(state.editInsumoId){
      await apiUpdateInsumo(state.editInsumoId, datos);
      const item = state.insumos.find(i=>i.id===state.editInsumoId);
      if(item) Object.assign(item, datos);
      state.toast = 'Insumo actualizado — ' + datos.nombre;
    }else{
      const nuevo = Object.assign({ id: uidInsumo() }, datos);
      await apiCreateInsumo(nuevo);
      state.insumos.unshift(nuevo);
      state.toast = 'Insumo agregado — ' + datos.nombre;
    }
    state.showInsumoModal = false; state.editInsumoId = null;
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 2600);
  }catch(err){
    btn.disabled = false; btn.textContent = 'Guardar';
    errorEl.textContent = 'Ocurrió un error al guardar: ' + (err && err.message ? err.message : 'error desconocido');
    errorEl.style.display = 'block';
  }
}
async function ajustarCantidad(id, delta){
  const item = state.insumos.find(i=>i.id===id);
  if(!item) return;
  const nuevaCantidad = Math.max(0, (parseFloat(item.cantidad)||0) + delta);
  const prevCantidad = item.cantidad, prevFecha = item.fecha_ultima_actualizacion;
  item.cantidad = nuevaCantidad; item.fecha_ultima_actualizacion = todayISO();
  renderInsumosList();
  try{ await apiUpdateInsumo(id, { cantidad: nuevaCantidad, fecha_ultima_actualizacion: item.fecha_ultima_actualizacion }); }
  catch(e){
    item.cantidad = prevCantidad; item.fecha_ultima_actualizacion = prevFecha;
    state.toast = 'No se pudo guardar el ajuste. Intenta de nuevo.';
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 3200);
  }
}
function askDeleteInsumoConfirm(id){ state.deleteInsumoConfirmId = id; renderInsumosList(); }
function cancelDeleteInsumoConfirm(){ state.deleteInsumoConfirmId = null; renderInsumosList(); }
async function confirmDeleteInsumo(id){
  state.deleteInsumoConfirmId = null;
  try{ await apiDeleteInsumo(id); state.insumos = state.insumos.filter(i=>i.id!==id); state.toast = 'Insumo eliminado.'; }
  catch(e){ state.toast = 'No se pudo eliminar el insumo. Intenta de nuevo.'; }
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2600);
}

function toggleAssistant(){ state.showAssistant = !state.showAssistant; render(); }
async function handleAskAssistant(preset){
  const input = document.getElementById('assistant-input');
  const question = preset || (input ? input.value.trim() : '');
  if(!question) return;
  state.chatHistory.push({ role:'user', text:question });
  state.assistantLoading = true;
  render();
  try{
    let systemPrompt;
    if(state.vista === 'pedidos'){
      const contextData = state.pedidos.map(p=>({
        proveedor:p.proveedor, monto_usd:p.monto_usd, monto_clp:p.monto_clp, moneda_ingreso:p.moneda_ingreso,
        courier:p.courier, numero_seguimiento:p.numero_seguimiento, destino:p.destino, estado:p.estado,
        fecha_registro:p.fecha_registro, fecha_estimada:p.fecha_estimada,
        dias_sin_actualizacion: daysSince(p.fecha_ultima_actualizacion), agente_aduanero:p.agente_aduanero,
        pendiente_revision: !!p.pendiente_revision
      }));
      systemPrompt = assistantSystemPromptPedidos(contextData);
    }else{
      const contextData = state.insumos.map(i=>({
        nombre:i.nombre, categoria:i.categoria, ubicacion:i.ubicacion, cantidad:i.cantidad, unidad:i.unidad,
        notas:i.notas, dias_sin_actualizar: daysSince(i.fecha_ultima_actualizacion)
      }));
      systemPrompt = assistantSystemPromptInsumos(contextData);
    }
    const answer = await callClaude(systemPrompt, question);
    state.chatHistory.push({ role:'assistant', text:answer });
  }catch(e){
    state.chatHistory.push({ role:'assistant', text:'No pude conectarme con la IA. Intenta nuevamente.' });
  }
  state.assistantLoading = false;
  render();
  setTimeout(()=>{ const el=document.getElementById('chat-log'); if(el) el.scrollTop = el.scrollHeight; },0);
}

  const placeholder = state.vista === 'pedidos'

    : 'Pregúntame por ejemplo: «¿qué hay en Valdivia?» o «¿qué insumos no se actualizan hace tiempo?».';
  const chatContent = state.chatHistory.length===0 ? `<div class="chat-empty">${placeholder}</div>` : state.chatHistory.map(m=>`<div class="chat-msg ${m.role}">${escapeHTML(m.text)}</div>`).join('');

  return `

        </select>
        <div class="spacer"></div>
        <button class="btn btn-primary" onclick="openPedidoModal()">+ Nuevo pedido</button>
  ` : `
        <input type="text" placeholder="Buscar por nombre…" value="${escapeHTML(state.insumosFilters.search)}"
               oninput="state.insumosFilters.search=this.value; renderInsumosList();">
        <select onchange="state.insumosFilters.ubicacion=this.value; renderInsumosList();">
          <option ${state.insumosFilters.ubicacion==='Todos'?'selected':''}>Todos</option>
          ${UBICACIONES.map(u=>`<option ${state.insumosFilters.ubicacion===u?'selected':''}>${u}</option>`).join('')}
        </select>
        <select onchange="state.insumosFilters.categoria=this.value; renderInsumosList();">
          <option ${state.insumosFilters.categoria==='Todas'?'selected':''}>Todas</option>
          ${categoriasExistentes().map(c=>`<option ${state.insumosFilters.categoria===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <div class="spacer"></div>
        <button class="btn btn-primary" onclick="openInsumoModal()">+ Nuevo insumo</button>
  `;

  const footerHTML = esPedidos ? `
        ${state.confirmAction === 'reset' ? `
          <span class="dias-label">Esto agrega pedidos de ejemplo a la base de datos real. ¿Continuar?</span>
          <button class="link-btn" onclick="handleResetDemo()">Sí, agregar</button>
          <button class="link-btn" onclick="cancelConfirm()">Cancelar</button>
        ` : state.confirmAction === 'clear' ? `
          <span class="dias-label">Esto elimina TODOS los pedidos — no se puede deshacer. ¿Continuar?</span>
          <button class="link-btn" onclick="handleClearAll()">Sí, borrar todo</button>
          <button class="link-btn" onclick="cancelConfirm()">Cancelar</button>
        ` : `
          <button class="link-btn" onclick="askConfirm('reset')">Agregar datos de ejemplo</button>
          <button class="link-btn" onclick="askConfirm('clear')">Borrar todos los pedidos</button>
        `}
  ` : `<span class="dias-label">Usa los botones − / + en cada fila para ajustar el stock rápido, sin abrir el formulario.</span>`;

  const bannerHTML = esPedidos ? `<div class="info-banner">El estado se actualiza desde el menú de cada pedido, o usando "Actualizar estado": abre la página de seguimiento con un clic, pega lo que veas, y la IA sugiere el estado correspondiente.</div>` : '';

  const html = `
    <div class="topbar">
      <div class="topbar-inner">
        <div>
          <h1 class="page-title">${esPedidos ? 'Seguimiento de Pedidos' : 'Inventario'}</h1>
          <p class="page-sub">Innovex — Adquisiciones · <span class="live-dot ${live?'on':'off'}"></span> ${live?'En vivo':'conectando…'}</p>
        </div>
        <div class="stats-row">${statsHTML}</div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <span class="dias-label">${escapeHTML(state.session.user.email)}</span>
          <button class="btn-ghost btn-sm" onclick="handleLogout()">Cerrar sesión</button>
        </div>
      </div>
      <div class="tabs-row">
        <button class="tab-item ${esPedidos?'active':''}" onclick="switchVista('pedidos')">Pedidos</button>
        <button class="tab-item ${!esPedidos?'active':''}" onclick="switchVista('inventario')">Inventario</button>
      </div>
    </div>

    <div class="controls"><div class="controls-inner">${controlsHTML}</div></div>

    <div class="main">
      ${bannerHTML}
      <div id="list-container">${esPedidos ? pedidosListInnerHTML() : insumosListInnerHTML()}</div>
      <div class="footer-actions">${footerHTML}</div>
    </div>

    ${!state.showAssistant ? '<button class="assistant-toggle" onclick="toggleAssistant()">✦ Asistente IA</button>' : ''}
    ${state.showAssistant ? assistantPanelHTML() : ''}
    ${state.showPedidoModal ? pedidoModalHTML() : ''}
    ${state.agenteSummaryModal ? agenteModalHTML() : ''}
    ${state.actualizarEstadoModal ? actualizarEstadoModalHTML() : ''}
    ${state.showInsumoModal ? insumoModalHTML() : ''}
    ${state.toast ? `<div class="toast">${escapeHTML(state.toast)}</div>` : ''}
  `;
  document.getElementById('app').innerHTML = html;
}

/* ============================================================
   TIEMPO REAL
   ============================================================ */
let realtimeChannelPedidos = null;
let realtimeChannelInsumos = null;
function iniciarRealtimePedidos(){
  if(realtimeChannelPedidos) return;
  realtimeChannelPedidos = supabaseClient.channel('pedidos-realtime')
    .on('postgres_changes', { event:'*', schema:'public', table:'pedidos' }, handleRealtimeChangePedidos)
    .subscribe((status)=>{ state.realtimeConectado.pedidos = (status === 'SUBSCRIBED'); if(!state.showPedidoModal && !state.showInsumoModal) render(); });
}
function handleRealtimeChangePedidos(payload){
  let mensaje = null;
  if(payload.eventType === 'INSERT'){
    if(!state.pedidos.find(p=>p.id===payload.new.id)){ state.pedidos.unshift(payload.new); mensaje = 'Nuevo pedido recibido: ' + payload.new.proveedor; }
  } else if(payload.eventType === 'UPDATE'){
    const p = state.pedidos.find(x=>x.id===payload.new.id); if(p) Object.assign(p, payload.new);
  } else if(payload.eventType === 'DELETE'){ state.pedidos = state.pedidos.filter(p=>p.id!==payload.old.id); }
  if(!state.showPedidoModal && !state.showInsumoModal){
    if(mensaje) state.toast = mensaje;
    render();
    if(mensaje) setTimeout(()=>{ state.toast = null; render(); }, 2600);
  }
}
function iniciarRealtimeInsumos(){
  if(realtimeChannelInsumos) return;
  realtimeChannelInsumos = supabaseClient.channel('inventario-realtime')
    .on('postgres_changes', { event:'*', schema:'public', table:'inventario' }, handleRealtimeChangeInsumos)
    .subscribe((status)=>{ state.realtimeConectado.insumos = (status === 'SUBSCRIBED'); if(!state.showPedidoModal && !state.showInsumoModal) render(); });
}
function handleRealtimeChangeInsumos(payload){
  let mensaje = null;
  if(payload.eventType === 'INSERT'){
    if(!state.insumos.find(i=>i.id===payload.new.id)){ state.insumos.unshift(payload.new); mensaje = 'Insumo agregado: ' + payload.new.nombre; }
  } else if(payload.eventType === 'UPDATE'){
    const i = state.insumos.find(x=>x.id===payload.new.id); if(i) Object.assign(i, payload.new);
  } else if(payload.eventType === 'DELETE'){ state.insumos = state.insumos.filter(i=>i.id!==payload.old.id); }
  if(!state.showPedidoModal && !state.showInsumoModal){
    if(mensaje) state.toast = mensaje;
    render();
    if(mensaje) setTimeout(()=>{ state.toast = null; render(); }, 2600);
  }
}

/* ============================================================
   INICIO
   ============================================================ */
async function cargarTodo(){
  document.getElementById('app').innerHTML = '<div class="center-loading">Conectando con la base de datos…</div>';
  try{
    state.pedidos = await apiGetPedidos();
    state.insumos = await apiGetInsumos();
    state.loadError = null;
    iniciarRealtimePedidos();
    iniciarRealtimeInsumos();
  }catch(e){
    state.loadError = 'No se pudo conectar con la base de datos (' + (e && e.message ? e.message : 'error desconocido') + '). Revisa la conexión e inténtalo de nuevo.';
  }
  render();
}
async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  state.session = session;
  if(session){ await cargarTodo(); } else { render(); }
}
init();
supabaseClient.auth.onAuthStateChange((event, session)=>{
  if(event === 'SIGNED_OUT'){
    state.session = null; state.pedidos = []; state.insumos = [];
    if(realtimeChannelPedidos){ supabaseClient.removeChannel(realtimeChannelPedidos); realtimeChannelPedidos = null; }
    if(realtimeChannelInsumos){ supabaseClient.removeChannel(realtimeChannelInsumos); realtimeChannelInsumos = null; }
    render();
  }
});
setInterval(async ()=>{
  if(!state.session || state.showPedidoModal || state.showInsumoModal || state.loadError) return;
  try{ state.pedidos = await apiGetPedidos(); state.insumos = await apiGetInsumos(); render(); }
  catch(e){ /* respaldo silencioso */ }
}, 90000);
</script>
