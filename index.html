<style>
  :root{
    --bg:#F5F4EF; --surface:#FFFFFF; --surface-alt:#EFEEE6; --border:#DEDCD1;
    --ink:#1B2321; --ink-muted:#5C665F; --accent:#1B4B43; --accent-hover:#143A34;
    --accent-warm:#A6692E; --accent-warm-bg:#F3E6D6;
    --st-proceso:#6B7563;  --st-proceso-bg:#EEF0EC;
    --st-transito:#2E5C8A; --st-transito-bg:#E7EEF5;
    --st-aduana:#A6761D;   --st-aduana-bg:#F5EEDD;
    --st-destino:#1B4B43;  --st-destino-bg:#E4EEEC;
    --st-recibido:#2F6B3A; --st-recibido-bg:#E7F0E8;

  #app{min-height:100vh;}
  .center-loading{ display:flex;align-items:center;justify-content:center;height:100vh; color:var(--ink-muted); font-family:var(--font-display); font-size:18px; }
  .login-box{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:36px 34px; width:100%; max-width:380px; text-align:left; }

  .topbar{ padding:24px 40px 0; border-bottom:1px solid var(--border); background:var(--surface); }
  .topbar-inner{ display:flex; flex-direction:column; gap:16px; max-width:1280px; margin:0 auto; padding-bottom:18px; }
  .topbar-row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; }
  .account-menu-wrap{ position:relative; }
  .account-menu-btn{ font-size:18px; line-height:1; padding:6px 10px; }
  .account-menu-dropdown{ position:absolute; top:calc(100% + 6px); right:0; background:var(--surface); border:1px solid var(--border); border-radius:6px; box-shadow:0 8px 20px rgba(0,0,0,0.12); min-width:190px; padding:6px; z-index:30; display:flex; flex-direction:column; }
  .account-menu-item{ display:block; width:100%; text-align:left; background:none; border:none; padding:9px 12px; font-size:13.5px; color:var(--ink); border-radius:4px; cursor:pointer; font-family:var(--font-ui); text-decoration:none; }
  .account-menu-item:hover{ background:var(--surface-alt); }
  .page-title{ font-family:var(--font-display); font-size:26px; font-weight:600; margin:0 0 4px 0; letter-spacing:-0.01em; }
  .page-sub{ color:var(--ink-muted); font-size:13px; margin:0; }
  .live-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-left:6px; vertical-align:middle; }
  .live-dot.on{ background:var(--st-recibido); }
  .live-dot.off{ background:var(--ink-muted); }
  .stats-row{ display:flex; gap:22px; flex-wrap:wrap; justify-content:center; }
  .stat-chip{ border-left:3px solid var(--accent); padding-left:10px; min-width:90px; }
  .stat-chip.warn{ border-left-color:var(--st-atrasado); }
  .stat-value{ font-family:var(--font-display); font-size:22px; font-weight:600; line-height:1.1; }
  .stat-label{ font-size:11.5px; color:var(--ink-muted); margin-top:2px; }
  button.stat-chip{ background:none; font-family:inherit; text-align:left; cursor:pointer; border-radius:4px; padding:4px 10px 4px 8px; margin:-4px -2px -4px -8px; transition:background 0.12s; }
  button.stat-chip:hover{ background:var(--surface-alt); }
  .stat-chip-active{ background:var(--accent) !important; }

  .tabs-row{ max-width:1280px; margin:0 auto; display:flex; gap:4px; }
  .tab-item{ background:none; border:none; padding:10px 4px; margin-right:22px; font-size:14px; font-family:var(--font-ui);

  .controls input[type=text], .controls select{

  .tracking-link{ font-size:11.5px; color:var(--accent); text-decoration:none; font-weight:600; }

  .main{ max-width:1280px; margin:0 auto; padding:24px 40px 80px; }
  .info-banner{ background:var(--accent-warm-bg); border:1px solid #E0C9A6; color:#5C4322; border-radius:4px; padding:10px 14px; font-size:13px; margin-bottom:18px; }

  .tracking-line{ display:flex; align-items:center; gap:6px; color:var(--ink-muted); font-size:12.5px; }
  .courier-badge{ font-size:11px; font-weight:600; padding:1px 6px; border-radius:3px; background:var(--surface-alt); border:1px solid var(--border); color:var(--ink-muted); }

  .badge{ display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; background:var(--surface-alt); border:1px solid var(--border); color:var(--ink-muted); }

  .badge-revision{ background:var(--st-transito-bg); color:var(--st-transito); margin-left:8px; border:none; }
  .badge-atrasado{ background:var(--st-atrasado-bg); color:var(--st-atrasado); border:none; }
  .dias-label{ font-size:11.5px; color:var(--ink-muted); }
  .estado-select{ font-family:var(--font-ui); font-size:12.5px; font-weight:600; border-radius:20px; padding:4px 22px 4px 10px; border:1px solid var(--border);

  .footer-actions{ margin-top:22px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,20,18,0.45); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; }
  .modal{ background:var(--surface); border-radius:6px; max-width:560px; width:100%; padding:28px 30px 26px; box-shadow:0 12px 32px rgba(0,0,0,0.18); }
  .modal-title{ font-family:var(--font-display); font-size:20px; margin:0 0 4px; }
  .modal-close{ float:right; background:none; border:none; font-size:20px; color:var(--ink-muted); cursor:pointer; line-height:1; }
  .modal-tabs{ display:flex; gap:4px; margin:18px 0 18px; border-bottom:1px solid var(--border); }
  .tab-btn{ background:none; border:none; padding:9px 4px; margin-right:18px; font-size:13.5px; color:var(--ink-muted); cursor:pointer; border-bottom:2px solid transparent; font-family:var(--font-ui); }

  .form-field{ display:flex; flex-direction:column; gap:5px; }

  .form-field label{ font-size:12px; color:var(--ink-muted); }
  .form-field input, .form-field select, .form-field textarea{
    font-family:var(--font-ui); font-size:14px; padding:9px 10px; border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--ink); outline:none;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{ border-color:var(--accent); }
  .form-field textarea{ resize:vertical; min-height:70px; font-family:var(--font-ui); }
  .form-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .extract-status{ font-size:12.5px; color:var(--ink-muted); margin-top:8px; min-height:16px; }
  .field-note{ font-size:12px; color:var(--accent-warm); background:var(--accent-warm-bg); padding:8px 10px; border-radius:4px; margin-bottom:14px; }

  .assistant-toggle{ position:fixed; bottom:24px; right:24px; z-index:40; background:var(--accent); color:#fff; border:none; border-radius:24px;
    padding:12px 20px; font-family:var(--font-ui); font-size:13.5px; font-weight:600; cursor:pointer; box-shadow:0 6px 18px rgba(27,75,67,0.35); }
  .assistant-toggle:hover{ background:var(--accent-hover); }
  .assistant-panel{ position:fixed; top:0; right:0; height:100vh; width:390px; max-width:92vw; background:var(--surface); border-left:1px solid var(--border);
    z-index:45; display:flex; flex-direction:column; box-shadow:-8px 0 24px rgba(0,0,0,0.10); }
  .assistant-header{ padding:20px 20px 14px; border-bottom:1px solid var(--border); }
  .assistant-header h3{ font-family:var(--font-display); font-size:18px; margin:0 0 2px; }
  .assistant-header p{ font-size:12px; color:var(--ink-muted); margin:0; }
  .assistant-close{ float:right; background:none; border:none; font-size:19px; color:var(--ink-muted); cursor:pointer; }
  .quick-prompts{ display:flex; flex-wrap:wrap; gap:6px; padding:12px 20px; border-bottom:1px solid var(--border); }
  .quick-prompt-btn{ font-size:11.5px; padding:5px 10px; border-radius:20px; border:1px solid var(--border); background:var(--surface-alt); color:var(--ink); cursor:pointer; font-family:var(--font-ui); }
  .quick-prompt-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .chat-log{ flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px; }
  .chat-empty{ color:var(--ink-muted); font-size:13px; padding-top:12px; }
  .chat-msg{ max-width:88%; padding:9px 12px; border-radius:8px; font-size:13.5px; white-space:pre-wrap; }
  .chat-msg.user{ align-self:flex-end; background:var(--accent); color:#fff; }
  .chat-msg.assistant{ align-self:flex-start; background:var(--surface-alt); color:var(--ink); }
  .chat-typing{ align-self:flex-start; color:var(--ink-muted); font-size:12.5px; padding:0 4px; }
  .assistant-input-row{ display:flex; gap:8px; padding:14px 20px 20px; border-top:1px solid var(--border); }
  .assistant-input-row input{ flex:1; font-family:var(--font-ui); font-size:13.5px; padding:9px 10px; border:1px solid var(--border); border-radius:4px; outline:none; }
  .assistant-input-row input:focus{ border-color:var(--accent); }

  .toast{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:60; background:var(--ink); color:#fff; padding:11px 22px;
    border-radius:6px; font-size:13.5px; font-weight:500; box-shadow:0 8px 22px rgba(0,0,0,0.25); }

  @media (max-width:760px){
    .topbar, .controls, .main{ padding-left:18px; padding-right:18px; }
    .row-item{ flex-wrap:wrap; }
    .col-nombre, .col-proveedor{ flex:1 1 100%; }
    .col-ubicacion, .col-destino, .col-categoria, .col-cantidad, .col-monto, .col-estado, .col-fecha, .col-acciones{ flex:1 1 45%; }
    .list-header{ display:none; }
    .form-grid{ grid-template-columns:1fr; }
    .assistant-panel{ width:100%; max-width:100%; }
  }
</style>

<body>
<div id="app"><div class="center-loading">Cargando sistema…</div></div>

<script>
/* ============================================================
   CONFIGURACIÓN COMPARTIDA
   ============================================================ */
const SUPABASE_URL = 'https://wncejgicemnaneptrrsq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DrQ2zuhGaxF09jQUrssLWQ_lLKtVbnL';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const CLAUDE_PROXY_URL = SUPABASE_URL + '/functions/v1/claude-proxy';

const ESTADOS = ['En proceso','En tránsito','En aduana','En destino','Recibido'];
const COURIERS = ['DHL','UPS','FedEx','MercadoLibre','Otro'];
const MONEDAS = ['CLP','USD','EUR'];
const DESTINOS = ['Puerto Montt','Valdivia'];
const UBICACIONES = ['Puerto Montt','Valdivia'];
const CATEGORIAS_SUGERIDAS = ['Herramientas','Tecnología','Materiales de maestranza','Seguridad','Oficina'];
const AREAS_SUGERIDAS = ['Adquisiciones','Bodega','Logística','Mantenimiento','Operaciones','Administración'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DEFAULT_TC = 930;

// Destinos posibles de la pantalla selectora. Se agregan acá cuando
// exista una página real para Subcontrataciones / Seguridad Ocupacional.
// url:null significa "quedarse en esta misma página" (Adquisiciones).
const TODOS_LOS_DESTINOS = [
  { area:'adquisiciones', nombre:'Adquisiciones', descripcion:'Pedidos e Inventario', url:null },
  { area:'dashboard', nombre:'Dashboard', descripcion:'Vista general para dirección', url:'./dashboard.html' }
];

const STATUS_META = {
  'En proceso':  {color:'var(--st-proceso)'},
  'En tránsito': {color:'var(--st-transito)'},
  'En aduana':   {color:'var(--st-aduana)'},
  'En destino':  {color:'var(--st-destino)'},
  'Recibido':    {color:'var(--st-recibido)'}
};

let state = {
  vista: 'pedidos', // 'pedidos' | 'inventario'
  session: null, loginError: null, loginLoading: false,
  toast: null, loadError: null,
  showAccountMenu: false,
  showAssistant: false, chatHistory: [], assistantLoading: false,
  realtimeConectado: { pedidos:false, insumos:false },

  // ---- Accesos / destinos ----
  accesoCompleto: false,
  destinosDisponibles: null, // null = aún no calculado
  destinoElegido: null,

  // ---- Pedidos ----
  pedidos: [],
  pedidosFilters: { search:'', destino:'Todos', estado:'Todos', filtroRapido:null },
  showPedidoModal: false,
  deletePedidoConfirmId: null,
  agenteSummaryModal: null,
  actualizarEstadoModal: null,
  confirmAction: null,

  // ---- Inventario ----
  insumos: [],
  insumosFilters: { search:'', ubicacion:'Todos', categoria:'Todas', filtroRapido:null },
  showInsumoModal: false,
  editInsumoId: null,
  deleteInsumoConfirmId: null,

  // ---- Compartido: historial, transferencias, roles ----
  historialModal: null,
  transferirModal: null,
  adjuntarModal: null,
  exportarModal: null,
  rol: 'editor'
};

/* ============================================================
   UTILIDADES COMPARTIDAS
   ============================================================ */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDaysISO(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysSince(iso){
  if(!iso) return 0;
  const d = new Date(iso+'T00:00:00'); const t = new Date(); t.setHours(0,0,0,0);
  return Math.max(0, Math.round((t-d)/86400000));
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.getDate()+' '+MESES[d.getMonth()];
}
function fmtUSD(n){ if(n===null||n===undefined||n==='') return '—'; return Number(n).toLocaleString('es-CL'); }
function fmtCLP(n){ if(n===null||n===undefined||n==='') return '—'; return Math.round(n).toLocaleString('es-CL'); }
function pedidoMonto(p){
  if(p.monto != null && p.moneda) return { monto: p.monto, moneda: p.moneda };
  // Respaldo para pedidos guardados antes de simplificar el monto (sin tipo de cambio).
  if(p.moneda_ingreso === 'CLP') return { monto: p.monto_clp, moneda: 'CLP' };
  if(p.monto_usd != null) return { monto: p.monto_usd, moneda: 'USD' };
  return { monto: null, moneda: null };
}
function fmtMonto(moneda, monto){
  if(monto===null || monto===undefined || monto==='') return '—';
  const val = Number(monto).toLocaleString('es-CL');
  if(moneda==='CLP') return '$' + val;
  if(moneda==='EUR') return '€' + val;
  return 'US$' + val;
}
function escapeHTML(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uidPedido(){ return 'p'+Date.now()+Math.random().toString(16).slice(2,7); }
function uidInsumo(){ return 'i'+Date.now()+Math.random().toString(16).slice(2,7); }
function withTimeout(promise, ms){
  return Promise.race([ promise, new Promise((_, reject)=> setTimeout(()=> reject(new Error('La operación tardó demasiado')), ms)) ]);
}
function parseJSONLoose(text){
  try{ return JSON.parse(text.replace(/```json/gi,'').replace(/```/g,'').trim()); }
  catch(e){ return {}; }
}
function nuevoIdHistorial(){ return 'h'+Date.now()+Math.random().toString(16).slice(2,7); }
async function registrarHistorial(entidad, entidad_id, descripcion){
  try{
    await supabaseClient.from('historial').insert({ id: nuevoIdHistorial(), entidad, entidad_id, descripcion, fecha: new Date().toISOString() });
  }catch(e){ console.warn('No se pudo registrar en el historial', e); }
}
async function abrirHistorialModal(entidad, entidad_id, nombre){
  state.historialModal = { entidad, entidad_id, nombre, items: [], loading: true, error: null };
  render();
  try{
    const { data, error } = await withTimeout(
      supabaseClient.from('historial').select('*').eq('entidad', entidad).eq('entidad_id', entidad_id).order('fecha', { ascending:false }),
      10000
    );
    if(error) throw error;
    state.historialModal.items = data;
  }catch(e){ state.historialModal.error = 'No se pudo cargar el historial: ' + (e && e.message ? e.message : 'error desconocido'); }
  state.historialModal.loading = false;
  render();
}
function cerrarHistorialModal(){ state.historialModal = null; render(); }

/* ============================================================
   API — PEDIDOS
   ============================================================ */
async function apiGetPedidos(){
  const { data, error } = await withTimeout(supabaseClient.from('pedidos').select('*').order('fecha_registro', { ascending:false }), 10000);
  if(error) throw new Error('Error al leer los pedidos: ' + error.message);
  return data;
}
async function apiCreatePedido(pedido){
  const { error } = await withTimeout(supabaseClient.from('pedidos').insert(pedido), 10000);
  if(error) throw new Error('Error al crear el pedido: ' + error.message);
}
async function apiUpdatePedido(id, updates){
  const { error } = await withTimeout(supabaseClient.from('pedidos').update(updates).eq('id', id), 10000);
  if(error) throw new Error('Error al actualizar el pedido: ' + error.message);
}
async function apiDeletePedido(id){
  const { error } = await withTimeout(supabaseClient.from('pedidos').delete().eq('id', id), 10000);
  if(error) throw new Error('Error al eliminar el pedido: ' + error.message);
}

/* ============================================================
   API — INVENTARIO

   IA (Claude API vía claude-proxy) — COMPARTIDO
   ============================================================ */
async function callClaude(systemPrompt, userMessage, imagen){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session) throw new Error('Sesión no válida. Vuelve a iniciar sesión.');
  const body = { system: systemPrompt, message: userMessage };
  if(imagen) body.imagen = imagen; // { data, media_type }
  const response = await fetch(CLAUDE_PROXY_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + session.access_token },
    body: JSON.stringify(body)
  });
  const data = await response.json();
  if(!data || !data.content){ throw new Error((data && data.error && data.error.message) || 'Error de API'); }
  return data.content.map(b=>b.text||'').join('\n');
}

function trackingUrl(p){
  if(!p.numero_seguimiento) return null;
  const num = encodeURIComponent(p.numero_seguimiento);
  if(p.courier === 'DHL') return `https://www.dhl.com/cl-es/home/rastreo.html?tracking-id=${num}`;
  if(p.courier === 'UPS') return `https://www.ups.com/track?loc=es_CL&tracknum=${num}`;
  if(p.courier === 'FedEx') return `https://www.fedex.com/fedextrack/?trknbr=${num}`;
  return null;
}
function estaVencido(p){
  return p.estado !== 'Recibido' && !!p.fecha_estimada && p.fecha_estimada < todayISO();
}
function computePedidoStats(){
  const activos = state.pedidos.filter(p=>p.estado!=='Recibido').length;
  const atrasados = state.pedidos.filter(p=>p.estado!=='Recibido' && daysSince(p.fecha_ultima_actualizacion)>=5).length;
  const conAgente = state.pedidos.filter(p=>p.agente_aduanero).length;
  const pendientesRevision = state.pedidos.filter(p=>p.pendiente_revision).length;
  const vencidos = state.pedidos.filter(estaVencido).length;
  return { activos, atrasados, conAgente, pendientesRevision, vencidos };
}
function getFilteredPedidos(){
  const { search, destino, estado, filtroRapido } = state.pedidosFilters;
  return state.pedidos.filter(p=>{
    if(destino!=='Todos' && p.destino!==destino) return false;
    if(estado!=='Todos' && p.estado!==estado) return false;
    if(filtroRapido==='activos' && p.estado==='Recibido') return false;
    if(filtroRapido==='atrasados' && !(p.estado!=='Recibido' && daysSince(p.fecha_ultima_actualizacion)>=5)) return false;
    if(filtroRapido==='agente' && !p.agente_aduanero) return false;
    if(filtroRapido==='revision' && !p.pendiente_revision) return false;
    if(filtroRapido==='vencidos' && !estaVencido(p)) return false;
    if(search){
      const s = search.toLowerCase();
      const hay = (p.proveedor||'').toLowerCase().includes(s) || (p.numero_seguimiento||'').toLowerCase().includes(s);
      if(!hay) return false;
    }
    return true;
  });
}

let imagenExtraida = null; // { data, media_type } o null

function leerImagenComoBase64(file){
  if(!file || file.type.indexOf('image') === -1) return;
  const reader = new FileReader();
  reader.onload = () => {
    const resultado = reader.result;
    const match = resultado.match(/^data:(.*?);base64,(.*)$/);
    if(!match) return;
    imagenExtraida = { media_type: match[1], data: match[2] };
    const cont = document.getElementById('imagen-preview-container');
    if(cont){
      cont.innerHTML = `<img src="${resultado}" style="max-width:170px;max-height:130px;border-radius:4px;border:1px solid var(--border);display:block;margin-bottom:6px;">
        <button type="button" class="link-btn" onclick="quitarImagenExtraida()">Quitar imagen</button>`;
    }
  };
  reader.readAsDataURL(file);
}
function handlePasteImagen(event){
  const items = event.clipboardData && event.clipboardData.items;
  if(!items) return;
  for(const item of items){
    if(item.type.indexOf('image') !== -1){
      leerImagenComoBase64(item.getAsFile());
      event.preventDefault();
      break;
    }
  }
}
function handleImagenSeleccionada(event){
  const file = event.target.files && event.target.files[0];
  if(file) leerImagenComoBase64(file);
}
function quitarImagenExtraida(){
  imagenExtraida = null;
  const cont = document.getElementById('imagen-preview-container');
  if(cont) cont.innerHTML = '';
  const input = document.getElementById('f-imagen-correo');
  if(input) input.value = '';
}

  if(!text && !imagenExtraida){ status.textContent = 'Pega el texto, o sube/pega una captura del correo.'; return; }
  btn.disabled = true; status.textContent = 'Extrayendo datos con IA…';
  try{
    const mensaje = text || 'Extrae los datos del pedido a partir de esta captura de un correo o mensaje.';
    const raw = await callClaude(EXTRACT_SYSTEM_PROMPT, mensaje, imagenExtraida);
    const data = parseJSONLoose(raw);
    if(data.proveedor) document.getElementById('f-proveedor').value = data.proveedor;
    if(MONEDAS.includes(data.moneda)) document.getElementById('f-moneda').value = data.moneda;
    if(data.monto) document.getElementById('f-monto').value = data.monto;
    if(data.numero_seguimiento) document.getElementById('f-tracking').value = data.numero_seguimiento;
    if(data.courier && COURIERS.includes(data.courier)) document.getElementById('f-courier').value = data.courier;

function leerImagenEstadoComoBase64(file){
  if(!file || file.type.indexOf('image') === -1) return;
  const reader = new FileReader();
  reader.onload = () => {
    const resultado = reader.result;
    const match = resultado.match(/^data:(.*?);base64,(.*)$/);
    if(!match) return;
    imagenEstado = { media_type: match[1], data: match[2] };
    const cont = document.getElementById('imagen-estado-preview');
    if(cont){
      cont.innerHTML = `<img src="${resultado}" style="max-width:170px;max-height:130px;border-radius:4px;border:1px solid var(--border);display:block;margin-bottom:6px;">
        <button type="button" class="link-btn" onclick="quitarImagenEstado()">Quitar imagen</button>`;
    }
  };
  reader.readAsDataURL(file);
}
function handlePasteImagenEstado(event){
  const items = event.clipboardData && event.clipboardData.items;
  if(!items) return;
  for(const item of items){
    if(item.type.indexOf('image') !== -1){
      leerImagenEstadoComoBase64(item.getAsFile());
      event.preventDefault();
      break;
    }
  }
}
function handleImagenEstadoSeleccionada(event){
  const file = event.target.files && event.target.files[0];
  if(file) leerImagenEstadoComoBase64(file);
}

function stockBajo(i){
  return i.stock_minimo != null && parseFloat(i.cantidad) < parseFloat(i.stock_minimo);
}
function computeInsumoStats(){
  const totalInsumos = state.insumos.length;
  const unidadesTotales = state.insumos.reduce((sum,i)=> sum + (parseFloat(i.cantidad)||0), 0);
  const sinActualizar = state.insumos.filter(i=> daysSince(i.fecha_ultima_actualizacion) >= 90).length;
  const bajoStock = state.insumos.filter(stockBajo).length;
  return { totalInsumos, unidadesTotales, sinActualizar, bajoStock };
}
function getFilteredInsumos(){
  const { search, ubicacion, categoria, filtroRapido } = state.insumosFilters;
  return state.insumos.filter(i=>{
    if(ubicacion!=='Todos' && i.ubicacion!==ubicacion) return false;
    if(categoria!=='Todas' && (i.categoria||'')!==categoria) return false;
    if(filtroRapido==='bajo' && !stockBajo(i)) return false;
    if(filtroRapido==='viejo' && daysSince(i.fecha_ultima_actualizacion) < 90) return false;
    if(search){ const s = search.toLowerCase(); if(!(i.nombre||'').toLowerCase().includes(s)) return false; }
    return true;
  });
}

  try{

    state.insumos = state.insumos.filter(i=>i.id!==id);
    state.toast = 'Insumo eliminado.';
    if(item) registrarHistorial('insumo', id, 'Insumo eliminado (' + item.nombre + ')');
  }
  catch(e){ state.toast = 'No se pudo eliminar el insumo. Intenta de nuevo.'; }
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2600);
}

function toggleAccountMenu(){ state.showAccountMenu = !state.showAccountMenu; render(); }
function toggleAssistant(){ state.showAssistant = !state.showAssistant; render(); }
async function handleAskAssistant(preset){
  const input = document.getElementById('assistant-input');
  const question = preset || (input ? input.value.trim() : '');
  if(!question) return;
  state.chatHistory.push({ role:'user', text:question });
  state.assistantLoading = true;
  render();
  try{
    let systemPrompt;
    if(state.vista === 'pedidos'){
      const contextData = state.pedidos.map(p=>{
        const m = pedidoMonto(p);
        return {
          proveedor:p.proveedor, monto:m.monto, moneda:m.moneda, area:p.area, solicitante:p.solicitante,
          courier:p.courier, numero_seguimiento:p.numero_seguimiento, destino:p.destino, estado:p.estado,
          internacional: !!p.internacional, fecha_orden:p.fecha_orden,
          fecha_registro:p.fecha_registro, fecha_estimada:p.fecha_estimada,
          dias_sin_actualizacion: daysSince(p.fecha_ultima_actualizacion), agente_aduanero:p.agente_aduanero,
          pendiente_revision: !!p.pendiente_revision
        };
      });
      systemPrompt = assistantSystemPromptPedidos(contextData);
    }else{
      const contextData = state.insumos.map(i=>({
        nombre:i.nombre, categoria:i.categoria, ubicacion:i.ubicacion, cantidad:i.cantidad, unidad:i.unidad,
        notas:i.notas, dias_sin_actualizar: daysSince(i.fecha_ultima_actualizacion)
      }));
      systemPrompt = assistantSystemPromptInsumos(contextData);
    }
    const answer = await callClaude(systemPrompt, question);
    state.chatHistory.push({ role:'assistant', text:answer });
  }catch(e){
    state.chatHistory.push({ role:'assistant', text:'No pude conectarme con la IA. Intenta nuevamente.' });
  }
  state.assistantLoading = false;
  render();
  setTimeout(()=>{ const el=document.getElementById('chat-log'); if(el) el.scrollTop = el.scrollHeight; },0);
}

/* ---------- Transferencia entre sedes (inventario) ---------- */
function abrirTransferirModal(id){
  const item = state.insumos.find(i=>i.id===id);
  if(!item) return;
  const destino = UBICACIONES.find(u=>u!==item.ubicacion);
  state.transferirModal = { insumoId:id, destino, cantidad:'', error:null, loading:false };
  render();
}
function cerrarTransferirModal(){ state.transferirModal = null; render(); }
async function confirmarTransferencia(){
  const m = state.transferirModal;
  const item = state.insumos.find(i=>i.id===m.insumoId);
  if(!item) return;
  const cantidad = parseFloat(document.getElementById('f-cantidad-transferir').value);
  if(isNaN(cantidad) || cantidad <= 0){ m.error = 'Ingresa una cantidad válida, mayor que 0.'; render(); return; }
  if(cantidad > item.cantidad){ m.error = 'No puedes transferir más de lo que hay disponible (' + item.cantidad + ').'; render(); return; }
  m.loading = true; m.error = null;
  render();
  try{
    const nuevaCantidadOrigen = item.cantidad - cantidad;
    await apiUpdateInsumo(item.id, { cantidad: nuevaCantidadOrigen, fecha_ultima_actualizacion: todayISO() });
    item.cantidad = nuevaCantidadOrigen;
    item.fecha_ultima_actualizacion = todayISO();
    registrarHistorial('insumo', item.id, 'Transferencia: salieron ' + cantidad + ' hacia ' + m.destino);

    const existente = state.insumos.find(i=>i.id!==item.id && i.ubicacion===m.destino && (i.nombre||'').trim().toLowerCase() === (item.nombre||'').trim().toLowerCase());
    if(existente){
      const nuevaCantidadDestino = (parseFloat(existente.cantidad)||0) + cantidad;
      await apiUpdateInsumo(existente.id, { cantidad: nuevaCantidadDestino, fecha_ultima_actualizacion: todayISO() });
      existente.cantidad = nuevaCantidadDestino;
      existente.fecha_ultima_actualizacion = todayISO();
      registrarHistorial('insumo', existente.id, 'Transferencia: llegaron ' + cantidad + ' desde ' + item.ubicacion);
    }else{
      const nuevo = {
        id: uidInsumo(), nombre: item.nombre, categoria: item.categoria, ubicacion: m.destino,
        cantidad: cantidad, unidad: item.unidad, notas: null, stock_minimo: item.stock_minimo,
        fecha_ultima_actualizacion: todayISO()
      };
      await apiCreateInsumo(nuevo);
      state.insumos.unshift(nuevo);
      registrarHistorial('insumo', nuevo.id, 'Creado por transferencia: llegaron ' + cantidad + ' desde ' + item.ubicacion);
    }

    state.transferirModal = null;
    state.toast = 'Transferencia realizada — ' + cantidad + ' ' + (item.unidad||'unidades') + ' a ' + m.destino;
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 2800);
  }catch(e){
    m.loading = false;
    m.error = 'No se pudo completar la transferencia: ' + (e && e.message ? e.message : 'error desconocido');
    render();
  }
}

  const input = document.getElementById('f-documento');
  const archivo = input.files && input.files[0];
  if(!archivo){ m.error = 'Elige primero un archivo.'; render(); return; }
  m.loading = true; m.error = null;
  render();
  try{
    const ruta = p.id + '/' + Date.now() + '_' + archivo.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const { error: uploadError } = await supabaseClient.storage.from('documentos').upload(ruta, archivo, { upsert: true });
    if(uploadError) throw uploadError;
    await apiUpdatePedido(p.id, { documento_path: ruta });
    p.documento_path = ruta;
    registrarHistorial('pedido', p.id, 'Documento adjuntado (' + archivo.name + ')');
    state.adjuntarModal = null;
    state.toast = 'Documento adjuntado.';
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 2600);
  }catch(e){
    m.loading = false;
    m.error = 'No se pudo subir el archivo: ' + (e && e.message ? e.message : 'error desconocido');
    render();
  }
}
async function verDocumento(pedidoId){
  const p = state.pedidos.find(x=>x.id===pedidoId);
  if(!p || !p.documento_path) return;
  try{
    const { data, error } = await supabaseClient.storage.from('documentos').createSignedUrl(p.documento_path, 60);
    if(error) throw error;
    window.open(data.signedUrl, '_blank', 'noopener');
  }catch(e){
    state.toast = 'No se pudo abrir el documento: ' + (e && e.message ? e.message : 'error desconocido');
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 3200);
  }
}
async function eliminarDocumento(pedidoId){
  const p = state.pedidos.find(x=>x.id===pedidoId);
  if(!p || !p.documento_path) return;
  const ruta = p.documento_path;
  try{
    await supabaseClient.storage.from('documentos').remove([ruta]);
    await apiUpdatePedido(pedidoId, { documento_path: null });
    p.documento_path = null;
    registrarHistorial('pedido', pedidoId, 'Documento eliminado');
    state.toast = 'Documento eliminado.';
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 2600);
  }catch(e){
    state.toast = 'No se pudo eliminar el documento: ' + (e && e.message ? e.message : 'error desconocido');
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 3200);
  }
}

function escribirExcel(datos, nombreHoja, nombreArchivo){
  if(datos.length === 0){
    state.toast = 'No hay datos para exportar con el filtro actual.';
    render();

  const ws = XLSX.utils.json_to_sheet(datos);

    Unidad: i.unidad||'', 'Stock mínimo': i.stock_minimo!=null ? i.stock_minimo : '',

function exportarExcelPedidos(desde, hasta){
  let lista = getFilteredPedidos();
  if(desde || hasta){
    lista = lista.filter(p=>{
      const fecha = p.fecha_orden || p.fecha_registro;
      if(!fecha) return false;
      if(desde && fecha < desde) return false;
      if(hasta && fecha > hasta) return false;
      return true;
    });
  }
  const datos = lista.map(p=>{
    const m = pedidoMonto(p);
    return {
      Proveedor: p.proveedor, Área: p.area||'', Solicitante: p.solicitante||'',
      'N° de seguimiento': p.numero_seguimiento||'', Courier: p.courier||'',
      Destino: p.destino||'', Monto: m.monto, Moneda: m.moneda||'', Estado: p.estado,
      Internacional: p.internacional ? 'Sí' : 'No', 'Agente aduanero': p.agente_aduanero ? 'Sí' : 'No',
      'Fecha de la orden': p.fecha_orden||'', 'Fecha registro': p.fecha_registro||'',
      'Fecha estimada': p.fecha_estimada||'', 'Última actualización': p.fecha_ultima_actualizacion||''
    };
  });
  escribirExcel(datos, 'Pedidos', 'pedidos_' + todayISO() + '.xlsx');
}

   ============================================================ */
let realtimeChannelPedidos = null;
let realtimeChannelInsumos = null;
function iniciarRealtimePedidos(){
  if(realtimeChannelPedidos) return;
  realtimeChannelPedidos = supabaseClient.channel('pedidos-realtime')
    .on('postgres_changes', { event:'*', schema:'public', table:'pedidos' }, handleRealtimeChangePedidos)
    .subscribe((status)=>{ state.realtimeConectado.pedidos = (status === 'SUBSCRIBED'); if(!state.showPedidoModal && !state.showInsumoModal) render(); });
}
function handleRealtimeChangePedidos(payload){
  let mensaje = null;
  if(payload.eventType === 'INSERT'){
    if(!state.pedidos.find(p=>p.id===payload.new.id)){ state.pedidos.unshift(payload.new); mensaje = 'Nuevo pedido recibido: ' + payload.new.proveedor; }
  } else if(payload.eventType === 'UPDATE'){
    const p = state.pedidos.find(x=>x.id===payload.new.id); if(p) Object.assign(p, payload.new);
  } else if(payload.eventType === 'DELETE'){ state.pedidos = state.pedidos.filter(p=>p.id!==payload.old.id); }
  if(!state.showPedidoModal && !state.showInsumoModal){
    if(mensaje) state.toast = mensaje;
    render();
    if(mensaje) setTimeout(()=>{ state.toast = null; render(); }, 2600);
  }
}
function iniciarRealtimeInsumos(){
  if(realtimeChannelInsumos) return;
  realtimeChannelInsumos = supabaseClient.channel('inventario-realtime')
    .on('postgres_changes', { event:'*', schema:'public', table:'inventario' }, handleRealtimeChangeInsumos)
    .subscribe((status)=>{ state.realtimeConectado.insumos = (status === 'SUBSCRIBED'); if(!state.showPedidoModal && !state.showInsumoModal) render(); });
}
function handleRealtimeChangeInsumos(payload){
  let mensaje = null;
  if(payload.eventType === 'INSERT'){
    if(!state.insumos.find(i=>i.id===payload.new.id)){ state.insumos.unshift(payload.new); mensaje = 'Insumo agregado: ' + payload.new.nombre; }
  } else if(payload.eventType === 'UPDATE'){
    const i = state.insumos.find(x=>x.id===payload.new.id); if(i) Object.assign(i, payload.new);
  } else if(payload.eventType === 'DELETE'){ state.insumos = state.insumos.filter(i=>i.id!==payload.old.id); }
  if(!state.showPedidoModal && !state.showInsumoModal){
    if(mensaje) state.toast = mensaje;
    render();
    if(mensaje) setTimeout(()=>{ state.toast = null; render(); }, 2600);
  }
}

async function cargarRol(){
  try{
    const { data, error } = await supabaseClient.from('perfiles').select('rol').eq('id', state.session.user.id).single();
    if(error || !data) { state.rol = 'editor'; return; }
    state.rol = data.rol || 'editor';
  }catch(e){ state.rol = 'editor'; }
}
async function cargarTodo(){
  document.getElementById('app').innerHTML = '<div class="center-loading">Conectando con la base de datos…</div>';
  try{
    await cargarRol();
    await cargarDestinos();

    if(state.destinosDisponibles.length > 1 && !state.destinoElegido){
      render();
      return;
    }
    if(state.destinosDisponibles.length === 0){
      render();
      return;
    }

    const destinoActual = state.destinoElegido || state.destinosDisponibles[0].area;
    const infoDestino = state.destinosDisponibles.find(d=>d.area===destinoActual);
    if(infoDestino && infoDestino.url){
      window.location.href = infoDestino.url;
      return;
    }

    state.pedidos = await apiGetPedidos();
    state.insumos = await apiGetInsumos();
    state.loadError = null;
    iniciarRealtimePedidos();
    iniciarRealtimeInsumos();
  }catch(e){
    state.loadError = 'No se pudo conectar con la base de datos (' + (e && e.message ? e.message : 'error desconocido') + '). Revisa la conexión e inténtalo de nuevo.';
  }
  render();
}
async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  state.session = session;
  if(session){ await cargarTodo(); } else { render(); }
}
init();
supabaseClient.auth.onAuthStateChange((event, session)=>{
  if(event === 'SIGNED_OUT'){
    state.session = null; state.pedidos = []; state.insumos = [];
    state.destinoElegido = null; state.destinosDisponibles = null; state.accesoCompleto = false;
    if(realtimeChannelPedidos){ supabaseClient.removeChannel(realtimeChannelPedidos); realtimeChannelPedidos = null; }
    if(realtimeChannelInsumos){ supabaseClient.removeChannel(realtimeChannelInsumos); realtimeChannelInsumos = null; }
    render();
  }
});
setInterval(async ()=>{
  if(!state.session || state.showPedidoModal || state.showInsumoModal || state.loadError) return;
  try{ state.pedidos = await apiGetPedidos(); state.insumos = await apiGetInsumos(); render(); }
  catch(e){ /* respaldo silencioso */ }
}, 90000);
</script>
