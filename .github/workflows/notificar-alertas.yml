name: Notificar alertas

on:
  schedule:
    - cron: '0 12 * * *'   # una vez al día, ~8-9am hora de Chile (ajusta si hace falta)
  workflow_dispatch: {}     # permite correrlo manualmente desde la pestaña "Actions"

jobs:
  notificar-alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        working-directory: scripts
        run: npm install
      - name: Ejecutar el script de notificaciones
        run: node scripts/notificar-alertas.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IONOS_EMAIL: ${{ secrets.IONOS_EMAIL }}
          IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
          NOTIFICAR_EMAIL: ${{ secrets.NOTIFICAR_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
