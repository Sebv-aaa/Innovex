name: Notificar alertas

on:
  schedule:
    # 8:15 am hora Chile (UTC-3, horario de verano vigente hasta abril
    # de 2027 — hay que revisar y ajustar este cronograma después de esa fecha)
    - cron: '15 11 * * 1-5'   # lunes a viernes
  workflow_dispatch: {}       # permite correrlo manualmente desde la pestaña "Actions"

jobs:
  notificar-alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        working-directory: scripts
        run: npm install
      - name: Ejecutar el script de notificaciones
        run: node scripts/notificar-alertas.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IONOS_EMAIL_1: ${{ secrets.IONOS_EMAIL_1 }}
          IONOS_PASSWORD_1: ${{ secrets.IONOS_PASSWORD_1 }}
          NOTIFICAR_EMAIL: ${{ secrets.NOTIFICAR_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
