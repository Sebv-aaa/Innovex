name: Notificar alertas

on:
  # Sin "schedule": GitHub atrasaba la ejecución programada entre 3 y 9 horas.
  # Ahora la dispara Supabase (pg_cron + pg_net, tarea "disparar-notificar-alertas")
  # lunes a viernes a las 8:15 hora Chile, llamando a la API de GitHub.
  # El horario se ajusta en Supabase (cron.schedule), no aquí; revisarlo en abril de 2027.
  workflow_dispatch: {}       # también permite correrlo manualmente desde la pestaña "Actions"

# Permisos mínimos: el workflow solo lee el código del repo.
permissions:
  contents: read

jobs:
  notificar-alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        working-directory: scripts
        run: npm install
      - name: Ejecutar el script de notificaciones
        run: node scripts/notificar-alertas.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICAR_EMAIL: ${{ secrets.NOTIFICAR_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
