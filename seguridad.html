<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innovex — Seguridad Ocupacional</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#F5F4EF; --surface:#FFFFFF; --surface-alt:#EFEEE6; --border:#DEDCD1;
    --ink:#1B2321; --ink-muted:#5C665F; --accent:#1B4B43; --accent-hover:#143A34;
    --accent-warm:#A6692E; --accent-warm-bg:#F3E6D6;
    --st-proceso:#6B7563;  --st-proceso-bg:#EEF0EC;
    --st-transito:#2E5C8A; --st-transito-bg:#E7EEF5;
    --st-aduana:#A6761D;   --st-aduana-bg:#F5EEDD;
    --st-recibido:#2F6B3A; --st-recibido-bg:#E7F0E8;
    --st-atrasado:#A6332F; --st-atrasado-bg:#F6E5E4;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  #app{min-height:100vh;}
  .center-loading{ display:flex;align-items:center;justify-content:center;height:100vh; color:var(--ink-muted); font-family:var(--font-display); font-size:18px; }
  .login-box{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:36px 34px; width:100%; max-width:380px; text-align:left; }

  .topbar{ padding:24px 40px 0; border-bottom:1px solid var(--border); background:var(--surface); }
  .topbar-inner{ display:flex; flex-direction:column; gap:16px; max-width:1280px; margin:0 auto; padding-bottom:18px; }
  .topbar-row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; }
  .account-menu-wrap{ position:relative; }
  .account-menu-btn{ font-size:18px; line-height:1; padding:6px 10px; }
  .account-menu-dropdown{ position:absolute; top:calc(100% + 6px); right:0; background:var(--surface); border:1px solid var(--border); border-radius:6px; box-shadow:0 8px 20px rgba(0,0,0,0.12); min-width:190px; padding:6px; z-index:30; display:flex; flex-direction:column; }
  .account-menu-item{ display:block; width:100%; text-align:left; background:none; border:none; padding:9px 12px; font-size:13.5px; color:var(--ink); border-radius:4px; cursor:pointer; font-family:var(--font-ui); text-decoration:none; }
  .account-menu-item:hover{ background:var(--surface-alt); }
  .page-title{ font-family:var(--font-display); font-size:26px; font-weight:600; margin:0 0 4px 0; letter-spacing:-0.01em; }
  .page-sub{ color:var(--ink-muted); font-size:13px; margin:0; }
  .stats-row{ display:flex; gap:22px; flex-wrap:wrap; justify-content:center; }
  .stat-chip{ border-left:3px solid var(--accent); padding-left:10px; min-width:90px; }
  .stat-chip.warn{ border-left-color:var(--st-aduana); }
  .stat-chip.bad{ border-left-color:var(--st-atrasado); }
  .stat-chip.rev{ border-left-color:var(--st-transito); }
  .stat-chip.off{ border-left-color:var(--st-proceso); }
  .stat-value{ font-family:var(--font-display); font-size:22px; font-weight:600; line-height:1.1; }
  .stat-label{ font-size:11.5px; color:var(--ink-muted); margin-top:2px; }

  .tabs-row{ max-width:1280px; margin:0 auto; display:flex; gap:4px; }
  .tab-item{ background:none; border:none; padding:10px 4px; margin-right:22px; font-size:14px; font-family:var(--font-ui); color:var(--ink-muted); cursor:pointer; border-bottom:2px solid transparent; }
  .tab-item.active{ color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }

  .controls{ padding:14px 40px; background:var(--surface-alt); border-bottom:1px solid var(--border); }
  .controls-inner{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; max-width:1280px; margin:0 auto; width:100%; }
  .controls input[type=text], .controls select{ font-family:var(--font-ui); font-size:13.5px; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:8px 10px; outline:none; }
  .controls input[type=text]:focus, .controls select:focus{ border-color:var(--accent); }
  .controls input[type=text]{ min-width:200px; flex:1; }
  .controls label.chk{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink); cursor:pointer; }

  .btn{ font-family:var(--font-ui); font-size:13.5px; font-weight:500; cursor:pointer; border-radius:4px; padding:9px 16px; border:1px solid transparent; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-ghost{ background:transparent; border-color:var(--border); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-sm{ padding:5px 10px; font-size:12.5px; }
  .btn:disabled{ opacity:0.55; cursor:default; }
  .link-btn{ background:none;border:none;color:var(--ink-muted);font-size:12.5px; text-decoration:underline; cursor:pointer; font-family:var(--font-ui); padding:0; }
  .link-btn:hover{ color:var(--ink); }

  .main{ max-width:1280px; margin:0 auto; padding:24px 40px 80px; }
  .info-banner{ background:var(--accent-warm-bg); border:1px solid #E0C9A6; color:#5C4322; border-radius:4px; padding:10px 14px; font-size:13px; margin-bottom:18px; }
  .field-note{ font-size:12px; color:var(--accent-warm); background:var(--accent-warm-bg); padding:8px 10px; border-radius:4px; margin-bottom:14px; }
  .empty-state{ padding:48px 16px; text-align:center; color:var(--ink-muted); font-family:var(--font-display); font-size:16px; }
  .dias-label{ font-size:11.5px; color:var(--ink-muted); }
  .form-field{ display:flex; flex-direction:column; gap:5px; }
  .form-field label{ font-size:12px; color:var(--ink-muted); }
  .form-field input{ font-family:var(--font-ui); font-size:14px; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:9px 11px; outline:none; }
  .form-field input:focus{ border-color:var(--accent); }
  .pw-wrap{ position:relative; display:flex; }
  .pw-wrap input{ flex:1; width:100%; padding-right:42px; }
  .pw-toggle{ position:absolute; right:4px; top:50%; transform:translateY(-50%); display:flex; align-items:center; justify-content:center; background:none; border:none; padding:6px; border-radius:4px; cursor:pointer; color:var(--ink-muted); }
  .pw-toggle:hover{ color:var(--ink); }
  .pw-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .toast{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:60; background:var(--ink); color:#fff; padding:11px 22px; border-radius:6px; font-size:13.5px; font-weight:500; box-shadow:0 8px 22px rgba(0,0,0,0.25); }

  .badge{ display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; background:var(--surface-alt); color:var(--ink-muted); white-space:nowrap; }
  .badge-ok{ background:var(--st-recibido-bg); color:var(--st-recibido); }
  .badge-warn{ background:var(--st-aduana-bg); color:var(--st-aduana); }
  .badge-bad{ background:var(--st-atrasado-bg); color:var(--st-atrasado); }
  .badge-rev{ background:var(--st-transito-bg); color:var(--st-transito); }
  .badge-off{ background:var(--st-proceso-bg); color:var(--st-proceso); }

  /* Tarjetas por plataforma */
  .plat-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px; margin-bottom:22px; }
  .plat-card{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:12px 14px; border-left:4px solid var(--st-recibido); }
  .plat-card.no{ border-left-color:var(--st-atrasado); }
  .plat-card h3{ font-family:var(--font-display); font-size:16px; margin:0 0 4px; }
  .plat-card .linea{ font-size:12.5px; color:var(--ink-muted); }
  .plat-card .vieja{ color:var(--st-atrasado); font-weight:600; }
  .plat-card.aviso{ border-left-color:var(--st-aduana); }
  .plat-card .acred-pronto{ color:var(--st-aduana); font-weight:600; }
  .plat-card .acred-vencida{ color:var(--st-atrasado); font-weight:600; }

  /* Tabla trabajador × plataforma */
  .tabla-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:6px; overflow-x:auto; }
  table.mx{ border-collapse:collapse; width:100%; }
  table.mx th, table.mx td{ padding:9px 12px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; vertical-align:middle; }
  table.mx th{ background:var(--surface-alt); font-size:12px; color:var(--ink-muted); font-weight:600; }
  table.mx th.c, table.mx td.c{ text-align:center; }
  table.mx td.n, table.mx th.n{ position:sticky; left:0; background:var(--surface); z-index:1; }
  table.mx th.n{ background:var(--surface-alt); }
  table.mx tr:last-child td{ border-bottom:none; }
  .celda{ background:none; border:1px solid transparent; border-radius:6px; padding:6px 8px; cursor:pointer; font-family:var(--font-ui); width:100%; min-width:130px; }
  .celda:hover, .celda:focus-visible{ border-color:var(--accent); outline:none; }
  .celda small{ display:block; font-size:11.5px; color:var(--ink-muted); margin-top:3px; }
  .no-esta{ color:#B3B7AE; font-size:12.5px; }
  .rut{ font-size:12px; color:var(--ink-muted); }

  /* Modal de documentos */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,20,18,0.45); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; }
  .modal{ background:var(--surface); border-radius:6px; max-width:760px; width:100%; padding:26px 28px 22px; box-shadow:0 12px 32px rgba(0,0,0,0.18); }
  .modal-title{ font-family:var(--font-display); font-size:20px; margin:0 0 2px; }
  .modal-close{ float:right; background:none; border:none; font-size:20px; color:var(--ink-muted); cursor:pointer; line-height:1; }
  .doc-fila{ display:flex; justify-content:space-between; align-items:center; gap:14px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
  .doc-fila:last-child{ border-bottom:none; }
  .doc-fila .der{ text-align:right; flex:0 0 auto; }

  /* Reporte para gerencia (dashboard) */
  .rep-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin:0 0 14px; }
  .rep-head h2{ font-family:var(--font-display); font-size:20px; margin:0; }
  .ctl-lbl{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-muted); }
  .chip-filtro{ display:inline-flex; align-items:center; gap:4px; background:var(--accent); color:#fff; border-radius:20px; padding:3px 4px 3px 11px; font-size:12.5px; font-weight:500; }
  .chip-filtro button{ background:rgba(255,255,255,0.18); border:none; color:#fff; width:20px; height:20px; border-radius:50%; cursor:pointer; font-size:11px; line-height:1; }
  .chip-filtro button:hover{ background:rgba(255,255,255,0.35); }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit, minmax(165px, 1fr)); gap:10px; margin-bottom:14px; }
  .kpi{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:12px 14px; border-top:3px solid var(--accent); }
  .kpi.kpi-med{ border-top-color:var(--st-aduana); } .kpi.kpi-bajo{ border-top-color:var(--st-atrasado); }
  .kpi-lbl{ font-size:12px; color:var(--ink-muted); }
  .kpi-val{ font-family:var(--font-display); font-size:30px; font-weight:600; line-height:1.15; margin:2px 0; white-space:nowrap; }
  .kpi-det{ font-size:11.5px; color:var(--ink-muted); }
  .kpi-ref{ font-style:italic; }
  .txt-ok{ color:var(--st-recibido); } .txt-med{ color:var(--st-aduana); } .txt-bajo{ color:var(--st-atrasado); }
  .dash-grid{ display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:12px; }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:14px 16px; min-width:0; }
  .panel-ancho{ grid-column:1 / -1; }
  .panel h3{ font-family:var(--font-display); font-size:16px; margin:0; }
  .panel-sub{ font-size:12px; color:var(--ink-muted); margin:2px 0 10px; }
  [data-atenuado]{ opacity:0.3; }
  [role=button]{ cursor:pointer; }
  [role=button]:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .torta-wrap{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .torta{ width:210px; max-width:100%; flex:0 0 auto; }
  .tajada{ stroke:var(--surface); stroke-width:2; transition:opacity .15s; }
  .tajada:hover{ filter:brightness(1.08); }
  .tajada:focus-visible{ outline:none; stroke:var(--ink); }
  .leyenda{ flex:1; min-width:210px; font-size:12.5px; }
  .ley-cab, .ley-item{ display:grid; grid-template-columns:14px 1fr 44px 58px; gap:8px; align-items:center; padding:4px 6px; border-radius:4px; }
  .ley-cab{ font-size:11px; color:var(--ink-muted); }
  .ley-cab span:nth-child(n+3), .ley-n, .ley-p{ text-align:right; }
  .ley-item:hover{ background:var(--surface-alt); }
  .ley-item.sel{ background:var(--surface-alt); font-weight:600; }
  .ley-color{ width:12px; height:12px; border-radius:3px; }
  .ley-n{ color:var(--ink-muted); }
  .barras{ display:flex; flex-direction:column; gap:2px; }
  .barra-fila{ display:grid; grid-template-columns:minmax(110px, 38%) 1fr 56px; gap:10px; align-items:center; padding:5px 6px; border-radius:4px; }
  .barra-fila:hover, .barra-fila.sel{ background:var(--surface-alt); }
  .barra-fila.sel .barra-nom{ font-weight:600; }
  .barra-nom{ font-size:12.5px; line-height:1.25; overflow-wrap:anywhere; }
  .barra-nom small{ display:block; font-size:11px; color:var(--ink-muted); font-weight:400; }
  .barra-pista{ height:14px; background:var(--surface-alt); border-radius:0 4px 4px 0; overflow:hidden; }
  .barra{ display:block; height:100%; border-radius:0 4px 4px 0; }
  .barra-val{ font-size:13px; font-weight:600; text-align:right; white-space:nowrap; }
  .nv-ok{ background:var(--st-recibido); } .nv-med{ background:var(--st-aduana); } .nv-bajo{ background:var(--st-atrasado); }
  .leyenda-nivel{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:11.5px; color:var(--ink-muted); margin:10px 0 0; }
  .leyenda-nivel span{ display:inline-flex; align-items:center; gap:5px; }
  .leyenda-nivel i{ display:inline-block; width:12px; height:8px; border-radius:2px; }
  .rep-tip{ position:fixed; z-index:70; display:none; pointer-events:none; background:var(--ink); color:#fff; font-size:12px; line-height:1.45; padding:8px 11px; border-radius:6px; max-width:300px; box-shadow:0 6px 18px rgba(0,0,0,0.22); }
  .rep-tip b{ display:block; font-size:12.5px; margin-bottom:2px; }
  .rep-sec{ font-family:var(--font-display); font-size:16px; margin:22px 0 4px; }
  table.mx td.pc{ text-align:center; font-size:13px; }
  table.mx td.pc b{ display:block; font-size:14px; }
  table.mx td.pc small{ color:var(--ink-muted); font-size:11.5px; }
  td.pc.c-ok{ background:var(--st-recibido-bg); } td.pc.c-med{ background:var(--st-aduana-bg); } td.pc.c-bajo{ background:var(--st-atrasado-bg); }
  table.mx tr.tot td{ font-weight:600; border-top:2px solid var(--border); }
  @media print{
    .controls, .tabs-row, .account-menu-wrap, .info-banner, .no-print, .stats-row, .rep-tip, .panel-sub{ display:none !important; }
    .panel, .kpi, .tabla-wrap{ break-inside:avoid; }
    .dash-grid{ grid-template-columns:1fr 1fr; }
    body{ background:#fff; }
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .tabla-wrap{ overflow:visible; }
    table.mx td.n{ position:static; }
  }

  @media (max-width:760px){
    .topbar, .controls, .main{ padding-left:16px; padding-right:16px; }
    .stats-row{ justify-content:flex-start; }
    .modal{ padding:20px 18px; }
    .doc-fila{ flex-wrap:wrap; }
    table.mx td.n{ white-space:normal; min-width:140px; max-width:170px; }
    .dash-grid{ grid-template-columns:minmax(0, 1fr); }
    .torta{ width:180px; margin:0 auto; }
    .kpis{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .kpi-val{ font-size:24px; }
    .ctl-lbl{ flex:1 1 140px; } .ctl-lbl select{ flex:1; min-width:0; }
  }
</style>

<body>
<div id="app"><div class="center-loading">Cargando sistema…</div></div>

<script>
/* ============================================================
   CONFIGURACIÓN (misma conexión que index.html)
   ============================================================ */
const SUPABASE_URL = 'https://wncejgicemnaneptrrsq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DrQ2zuhGaxF09jQUrssLWQ_lLKtVbnL';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const AREA = 'seguridad';
const DIAS_REVISION_ANTIGUA = 7;   // si la última revisión de una plataforma es más antigua, se avisa en su tarjeta
const DIAS_AVISO_ACREDITACION = 30; // si la acreditación de la empresa vence en estos días o menos, la tarjeta avisa

// Los datos vienen de las vistas seg_ultima_revision y seg_vigencias_actuales
// (última revisión de cada plataforma, leída por Claude con el navegador).
// Esta página solo muestra: no tiene botones para modificar datos.

// En la plataforma, un documento vencido, rechazado o que nunca se subió se ve igual
// (sin archivo), así que los tres se muestran con un solo estado: «Sin documento vigente».
const ESTADOS = {
  sin_vigente: { etiqueta:'Sin documento vigente', clase:'badge-bad',  orden:0 },
  en_revision: { etiqueta:'En revisión',           clase:'badge-rev',  orden:1 },
  por_vencer:  { etiqueta:'Por vencer',            clase:'badge-warn', orden:2 },
  vigente:     { etiqueta:'Vigente',               clase:'badge-ok',   orden:3 }
};
// Por si la base todavía entrega los estados antiguos
const ESTADO_ANTIGUO = { vencido:'sin_vigente', rechazado:'sin_vigente', falta:'sin_vigente' };

let state = {
  session: null, loginError: null, loginLoading: false,
  cargando: true, loadError: null, acceso: false,
  tab: 'matriz',
  revisiones: [], docs: [], nomina: new Map(),
  filtros: { texto: '', plataforma: '', estado: '' },
  pronto: { plataforma: '', incluirFaltantes: false },
  rep: { plataforma: '', area: '', foco: null },   // filtros del reporte
  modal: null,          // { rut, plataformaId }
  showAccountMenu: false
};

/* ============================================================
   UTILIDADES
   ============================================================ */
function escapeHTML(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function withTimeout(promise, ms){
  return Promise.race([ promise, new Promise((_, reject)=> setTimeout(()=> reject(new Error('La operación tardó demasiado')), ms)) ]);
}
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function mensajeError(e){ return (e && e.message) ? e.message : 'error desconocido'; }
function fmtRut(r){
  const m = /^(\d{7,8})-([0-9K])$/.exec(r || '');
  if(!m) return r || '';
  return m[1].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + m[2];
}
function fmtFecha(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? m[3] + '-' + m[2] + '-' + m[1] : (iso || '');
}
function hoyChile(){ return new Intl.DateTimeFormat('en-CA', { timeZone:'America/Santiago' }).format(new Date()); }
function fechaChile(ts){ return new Intl.DateTimeFormat('en-CA', { timeZone:'America/Santiago' }).format(new Date(ts)); }
function diasEntre(a, b){
  const x = a.split('-').map(Number), y = b.split('-').map(Number);
  return Math.round((Date.UTC(y[0], y[1]-1, y[2]) - Date.UTC(x[0], x[1]-1, x[2])) / 86400000);
}
function plural(n, s, p){ return n + ' ' + (n === 1 ? s : p); }
function textoDias(d){
  if(d === null || d === undefined) return '';
  if(d < 0) return 'venció hace ' + plural(-d, 'día', 'días');
  if(d === 0) return 'vence hoy';
  return 'vence en ' + plural(d, 'día', 'días');
}
function badge(estado, texto){ const e = ESTADOS[estado] || { clase:'', etiqueta:estado }; return `<span class="badge ${e.clase}">${escapeHTML(texto || e.etiqueta)}</span>`; }

/* ============================================================
   INICIO DE SESIÓN (igual que las demás páginas)
   ============================================================ */

async function handleLogin(){
  const email = val('login-email').trim();
  const password = val('login-password');
  if(!email || !password){ state.loginError = 'Ingresa tu correo y contraseña.'; render(); return; }
  state.loginLoading = true; state.loginError = null; render();
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  state.loginLoading = false;
  if(error){ state.loginError = 'No se pudo iniciar sesión: ' + error.message; render(); return; }
  state.session = data.session;
  await arrancar();
}

function limpiarEstado(){
  state.session = null; state.acceso = false; state.revisiones = []; state.docs = []; state.nomina = new Map();

async function cargarAcceso(){
  const uid = state.session.user.id;
  let completo = false;
  try{
    const p = await supabaseClient.from('perfiles').select('acceso_completo').eq('id', uid).single();
    completo = !!(p.data && p.data.acceso_completo);
  }catch(e){ /* queda en false */ }
  const a = await supabaseClient.from('perfiles_acceso').select('area,rol').eq('perfil_id', uid);
  if(a.error) throw new Error(a.error.message);
  state.acceso = completo || (a.data || []).some(x => x.area === AREA);
}
// Supabase entrega como máximo 1.000 filas por consulta: se piden por tramos.
async function leerTodo(vista, orden){
  const TRAMO = 1000; let desde = 0, filas = [];
  while(true){
    let q = supabaseClient.from(vista).select('*');
    orden.forEach(c => { q = q.order(c); });
    const { data, error } = await q.range(desde, desde + TRAMO - 1);
    if(error) throw new Error(error.message);
    filas = filas.concat(data || []);
    if(!data || data.length < TRAMO) return filas;
    desde += TRAMO;
  }
}
async function cargarDatos(){
  const [revs, docs, nomina] = await withTimeout(Promise.all([
    leerTodo('seg_ultima_revision', ['plataforma']),
    leerTodo('seg_vigencias_actuales', ['plataforma_id', 'rut', 'documento']),
    leerTodo('seg_nomina', ['rut']).catch(() => [])   // la nómina solo se usa en el reporte
  ]), 20000);
  docs.forEach(d => { if(ESTADO_ANTIGUO[d.estado]) d.estado = ESTADO_ANTIGUO[d.estado]; });
  state.revisiones = revs; state.docs = docs;
  state.nomina = new Map(nomina.map(n => [n.rut, n]));
}
async function arrancar(){
  state.cargando = true; render();
  try{
    await cargarAcceso();
    if(state.acceso) await cargarDatos();
    state.loadError = null;
  }catch(e){
    state.loadError = 'No se pudo conectar con la base de datos (' + mensajeError(e) + '). Revisa la conexión e inténtalo de nuevo.';
  }
  state.cargando = false;
  render();
}

/* ============================================================
   CÁLCULOS (el estado de cada documento viene calculado de la base)
   ============================================================ */
function docsDe(rut, platId){ return state.docs.filter(d => d.rut === rut && d.plataforma_id === platId); }
function trabajadores(){
  const m = new Map();
  state.docs.forEach(d => { if(!m.has(d.rut)) m.set(d.rut, { rut: d.rut, nombre: d.nombre, plats: new Set() }); m.get(d.rut).plats.add(d.plataforma_id); });
  return [...m.values()].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
}
function conteo(docs){
  const c = { sin_vigente:0, en_revision:0, por_vencer:0, vigente:0 };
  docs.forEach(d => { if(c[d.estado] !== undefined) c[d.estado]++; });
  return c;
}
function apto(c){ return c.sin_vigente + c.en_revision === 0; }
// Resumen de un trabajador en una plataforma: [estado principal, texto, detalle]
function resumenCelda(docs){
  const c = conteo(docs);
  const extra = excluir => [
    excluir !== 'sin_vigente' && c.sin_vigente ? c.sin_vigente + ' sin documento vigente' : '',
    excluir !== 'en_revision' && c.en_revision ? c.en_revision + ' en revisión' : '',
    excluir !== 'por_vencer' && c.por_vencer ? c.por_vencer + ' por vencer' : ''
  ].filter(Boolean).join(' · ');
  if(c.sin_vigente) return ['sin_vigente', c.sin_vigente + ' sin documento vigente', extra('sin_vigente')];
  if(c.en_revision) return ['en_revision', c.en_revision + ' en revisión', extra('en_revision')];
  const conFecha = docs.filter(d => d.dias_restantes !== null && d.dias_restantes !== undefined);
  const prox = conFecha.length ? conFecha.reduce((a, b) => a.dias_restantes <= b.dias_restantes ? a : b) : null;
  if(c.por_vencer) return ['por_vencer', textoDias(prox.dias_restantes), plural(c.por_vencer, 'doc. por vencer', 'docs. por vencer')];
  return ['vigente', 'Al día', prox ? 'próx. ' + fmtFecha(prox.vigencia) : ''];
}
function totales(){
  const docs = state.filtros.plataforma ? state.docs.filter(d => String(d.plataforma_id) === state.filtros.plataforma) : state.docs;
  return conteo(docs);
}
function plataformasVisibles(){
  return state.filtros.plataforma ? state.revisiones.filter(r => String(r.plataforma_id) === state.filtros.plataforma) : state.revisiones;
}
function trabajadoresFiltrados(){
  const f = state.filtros, txt = f.texto.trim().toLowerCase();
  const plats = plataformasVisibles().map(r => r.plataforma_id);
  return trabajadores().filter(w => {
    if(!plats.some(p => w.plats.has(p))) return false;
    if(txt && !(w.nombre.toLowerCase().includes(txt) || w.rut.toLowerCase().includes(txt) || fmtRut(w.rut).toLowerCase().includes(txt))) return false;
    if(!f.estado) return true;
    const cs = plats.filter(p => w.plats.has(p)).map(p => conteo(docsDe(w.rut, p)));
    if(f.estado === 'sin_vigente') return cs.some(c => c.sin_vigente);
    if(f.estado === 'por_vencer') return cs.some(c => c.por_vencer);
    if(f.estado === 'en_revision') return cs.some(c => c.en_revision);
    if(f.estado === 'no_apto') return cs.some(c => !apto(c));
    if(f.estado === 'apto') return cs.every(c => apto(c));
    return true;
  });
}

function filasPronto(){
  const f = state.pronto;
  const estados = f.incluirFaltantes ? ['por_vencer', 'sin_vigente'] : ['por_vencer'];

  return state.docs
    .filter(d => estados.includes(d.estado) && (!f.plataforma || String(d.plataforma_id) === f.plataforma))
    .sort((a, b) => {
      const ra = a.dias_restantes ?? 99999, rb = b.dias_restantes ?? 99999;
      return ra - rb || ESTADOS[a.estado].orden - ESTADOS[b.estado].orden || a.nombre.localeCompare(b.nombre, 'es');
    });
}
function textoVence(d){
  if(d.vigencia) return fmtFecha(d.vigencia);

/* ============================================================
   REPORTE PARA GERENCIA (dashboard interactivo)
   - % de cumplimiento = documentos vigentes o por vencer / documentos requeridos (indicador principal)
   - % trabajadores aptos = trabajadores con todos sus documentos vigentes / trabajadores
   - El área sale de la nómina (seg_nomina), cruzada por RUT.
   - Filtros: plataforma y área. Clic en la torta o en una barra filtra; volver a hacer clic lo quita.
   ============================================================ */
const SIN_AREA = 'Sin área (no está en la nómina)';
const OTRAS = 'Otras áreas';
// Áreas que se muestran juntas (la nómina ya las guarda así desde el 11-11-2026; esto cubre planillas antiguas)
const AREAS_AGRUPADAS = { 'Monitoreo Mar Norte':'Monitoreo Mar', 'Monitoreo Mar Sur':'Monitoreo Mar', 'Monitoreo Mar Soporte':'Monitoreo Mar' };
// Colores de la torta: cada área conserva su color aunque cambie el filtro (orden validado para daltonismo)
const COLORES_AREA = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6'];
const COLOR_OTRAS = '#bdbab0', COLOR_SIN_AREA = '#77756d';
function docOk(d){ return d.estado === 'vigente' || d.estado === 'por_vencer'; }
function nivel(p){ return p === null ? '' : (p >= 90 ? 'ok' : (p >= 70 ? 'med' : 'bajo')); }
function pct(a, b){ return b ? Math.round(1000 * a / b) / 10 : null; }
function fmtPct(p){ return p === null || p === undefined ? '—' : String(p).replace('.', ',') + ' %'; }
function nombreArea(a){ return AREAS_AGRUPADAS[a] || a; }
function areaDe(rut){ const n = state.nomina.get(rut); return n ? nombreArea(n.area) : SIN_AREA; }
// Resume un grupo de documentos: % de documentos y trabajadores aptos (apto en todas sus plataformas del grupo)
function resumir(docs){
  const ok = docs.filter(docOk).length;
  const pares = new Map();
  docs.forEach(d => { const k = d.rut + '|' + d.plataforma_id; if(!pares.has(k)) pares.set(k, true); if(!docOk(d)) pares.set(k, false); });
  const trab = new Map();
  pares.forEach((esApto, k) => { const r = k.split('|')[0]; trab.set(r, (trab.has(r) ? trab.get(r) : true) && esApto); });
  const aptos = [...trab.values()].filter(Boolean).length;
  const c = conteo(docs);
  return { docs: docs.length, ok, pDocs: pct(ok, docs.length), trab: trab.size, aptos, pAptos: pct(aptos, trab.size),
           sinVigente: c.sin_vigente, porVencer: c.por_vencer, enRevision: c.en_revision };
}
// Grupos de la torta, calculados con todos los datos (no cambian con el filtro):
// las 7 áreas con más trabajadores tienen color propio; el resto va a «Otras áreas».
function gruposArea(){
  const cuenta = new Map();
  state.docs.forEach(d => { const a = areaDe(d.rut); if(a === SIN_AREA) return; if(!cuenta.has(a)) cuenta.set(a, new Set()); cuenta.get(a).add(d.rut); });
  const orden = [...cuenta.keys()].sort((a, b) => cuenta.get(b).size - cuenta.get(a).size || a.localeCompare(b, 'es'));
  const color = new Map(), grupo = new Map();
  orden.forEach((a, i) => {
    const propia = i < COLORES_AREA.length;
    grupo.set(a, propia ? a : OTRAS);
    if(propia) color.set(a, COLORES_AREA[i]);
  });
  color.set(OTRAS, COLOR_OTRAS); color.set(SIN_AREA, COLOR_SIN_AREA); grupo.set(SIN_AREA, SIN_AREA);
  const claves = [...orden.slice(0, COLORES_AREA.length), ...(orden.length > COLORES_AREA.length ? [OTRAS] : []), SIN_AREA];
  return { color, grupo, claves, otras: orden.slice(COLORES_AREA.length) };
}
function coincideArea(a, filtro, g){ return !filtro || (filtro === OTRAS ? g.grupo.get(a) === OTRAS : a === filtro); }
function docsReporte(conPlat, conArea, g){
  const f = state.rep;
  return state.docs.filter(d => (!conPlat || !f.plataforma || String(d.plataforma_id) === f.plataforma) && (!conArea || coincideArea(areaDe(d.rut), f.area, g)));
}
function nombrePlat(id){ const r = state.revisiones.find(x => String(x.plataforma_id) === String(id)); return r ? r.plataforma : ''; }

// --- Interacción ---
let repAcciones = [];   // acciones de los elementos clicables del último dibujo
function accion(fn){ repAcciones.push(fn); return repAcciones.length - 1; }
function repClic(i){ const fn = repAcciones[i]; if(fn) fn(); }
function repTecla(e, i){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); repClic(i); } }
function alternarFiltro(campo, valor){
  const act = document.activeElement;
  state.rep.foco = act && act.dataset ? (act.dataset.foco || null) : null;
  state.rep[campo] = state.rep[campo] === valor ? '' : valor;
  refrescarReporte();
}
function fijarFiltro(campo, valor){ state.rep[campo] = valor; state.rep.foco = null; refrescarReporte(); }
function refrescarReporte(){
  ocultarTip();
  const ctl = document.getElementById('controles'); if(ctl) ctl.innerHTML = controlesHTML();
  const c = document.getElementById('contenido'); if(c) c.innerHTML = contenidoHTML();
  // Mantiene el foco del teclado en el elemento que se usó
  if(state.rep.foco){ const el = [...document.querySelectorAll('[data-foco]')].find(x => x.dataset.foco === state.rep.foco); if(el) el.focus({ preventScroll:true }); }
}
// Atributos comunes de un elemento clicable: acción, teclado, detalle (tooltip) y estado atenuado
function attrsClic(i, tip, foco, atenuado, etiqueta){
  return `role="button" tabindex="0" onclick="repClic(${i})" onkeydown="repTecla(event, ${i})" data-tip="${escapeHTML(tip)}" data-foco="${escapeHTML(foco)}" aria-label="${escapeHTML(etiqueta)}" ${atenuado ? 'data-atenuado="1"' : ''}`;
}
// Detalle al pasar el mouse o al enfocar con el teclado (texto plano, sin HTML)
function tipEl(){
  let t = document.getElementById('rep-tip');
  if(!t){ t = document.createElement('div'); t.id = 'rep-tip'; t.className = 'rep-tip'; t.setAttribute('role', 'tooltip'); document.body.appendChild(t); }
  return t;
}
function mostrarTip(el, x, y){
  const t = tipEl(); const lineas = el.getAttribute('data-tip').split('\n');
  t.textContent = '';
  lineas.forEach((l, i) => { const p = document.createElement(i === 0 ? 'b' : 'div'); p.textContent = l; t.appendChild(p); });
  t.style.display = 'block';
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.max(8, Math.min(x + 14, window.innerWidth - w - 8)) + 'px';
  t.style.top = (y + 16 + h > window.innerHeight ? y - h - 12 : y + 16) + 'px';
}
function ocultarTip(){ const t = document.getElementById('rep-tip'); if(t) t.style.display = 'none'; }
document.addEventListener('mousemove', e => {
  const el = e.target.closest ? e.target.closest('[data-tip]') : null;
  if(el) mostrarTip(el, e.clientX, e.clientY); else ocultarTip();
});
document.addEventListener('focusin', e => {
  const el = e.target.closest ? e.target.closest('[data-tip]') : null;
  if(el && el.matches(':focus-visible')){ const r = el.getBoundingClientRect(); mostrarTip(el, r.left + r.width / 2, r.bottom); } else ocultarTip();
});
document.addEventListener('scroll', ocultarTip, true);

// --- Piezas del dashboard ---
function kpiGrande(etiqueta, valor, detalle, clase){
  return `<div class="kpi ${clase || ''}"><div class="kpi-lbl">${etiqueta}</div><div class="kpi-val">${valor}</div>${detalle ? `<div class="kpi-det">${detalle}</div>` : ''}</div>`;
}
function textoTrab(r){ return `${r.aptos} de ${r.trab} aptos`; }
function tortaHTML(g){
  const docs = docsReporte(true, false, g);
  const porGrupo = new Map();
  docs.forEach(d => { const k = g.grupo.get(areaDe(d.rut)); if(!porGrupo.has(k)) porGrupo.set(k, new Set()); porGrupo.get(k).add(d.rut); });
  const total = [...porGrupo.values()].reduce((s, x) => s + x.size, 0);
  if(!total) return `<div class="empty-state">Sin trabajadores con este filtro.</div>`;
  const R = 92, C = 100;
  let ang = -Math.PI / 2, svg = '', leyenda = '';
  g.claves.filter(k => porGrupo.has(k)).forEach(k => {
    const n = porGrupo.get(k).size, frac = n / total;
    const r = resumir(docs.filter(d => g.grupo.get(areaDe(d.rut)) === k));
    const sel = state.rep.area === k, atenuado = state.rep.area && !sel && !(state.rep.area !== OTRAS && k === OTRAS && g.grupo.get(state.rep.area) === OTRAS);
    const pctTrab = String(Math.round(1000 * frac) / 10).replace('.', ',');
    const incluye = k === OTRAS ? `\nIncluye: ${g.otras.join(', ')}` : '';
    const tip = `${k}\n${plural(n, 'trabajador', 'trabajadores')} (${pctTrab} % del total)\nCumplimiento: ${fmtPct(r.pDocs)} (${r.ok} de ${r.docs} documentos)\nTrabajadores aptos: ${r.aptos} de ${r.trab}${incluye}\n${sel ? 'Clic para quitar el filtro' : 'Clic para filtrar por esta área'}`;
    const i = accion(() => alternarFiltro('area', k));
    const a2 = ang + frac * 2 * Math.PI;
    const p1 = [C + R * Math.cos(ang), C + R * Math.sin(ang)], p2 = [C + R * Math.cos(a2), C + R * Math.sin(a2)];
    const d = frac >= 0.9999 ? null : `M${C},${C} L${p1[0].toFixed(2)},${p1[1].toFixed(2)} A${R},${R} 0 ${frac > 0.5 ? 1 : 0} 1 ${p2[0].toFixed(2)},${p2[1].toFixed(2)} Z`;
    const at = attrsClic(i, tip, 'area:' + k, atenuado, `${k}: ${n} trabajadores, cumplimiento ${fmtPct(r.pDocs)}`);
    svg += d ? `<path class="tajada" d="${d}" fill="${g.color.get(k)}" ${at}></path>` : `<circle class="tajada" cx="${C}" cy="${C}" r="${R}" fill="${g.color.get(k)}" ${at}></circle>`;
    leyenda += `<div class="ley-item ${sel ? 'sel' : ''}" ${attrsClic(accion(() => alternarFiltro('area', k)), tip, 'ley:' + k, atenuado, `${k}: ${n} trabajadores`)}>
      <span class="ley-color" style="background:${g.color.get(k)}"></span><span class="ley-nom">${escapeHTML(k)}</span><span class="ley-n">${n}</span><span class="ley-p">${fmtPct(r.pDocs)}</span></div>`;
    ang = a2;
  });
  return `<div class="torta-wrap">
    <svg class="torta" viewBox="0 0 200 200" role="group" aria-label="Trabajadores por área">${svg}</svg>
    <div class="leyenda"><div class="ley-cab"><span></span><span>Área</span><span>Trab.</span><span>Cumpl.</span></div>${leyenda}</div>
  </div>`;
}
// Barras horizontales del % de cumplimiento (color según el nivel: verde, amarillo o rojo)
function barrasHTML(filas){
  return `<div class="barras">${filas.map(f => `<div class="barra-fila ${f.sel ? 'sel' : ''}" ${attrsClic(f.i, f.tip, f.foco, f.atenuado, f.etiqueta)}>
      <span class="barra-nom">${escapeHTML(f.nombre)}<small>${f.sub}</small></span>
      <span class="barra-pista"><span class="barra nv-${nivel(f.p)}" style="width:${f.p || 0}%"></span></span>
      <span class="barra-val">${fmtPct(f.p)}</span>
    </div>`).join('')}</div>`;
}
function barrasAreaHTML(g){
  const docs = docsReporte(true, false, g);
  const areas = [...new Set(docs.map(d => areaDe(d.rut)))];
  const filas = areas.map(a => {
    const r = resumir(docs.filter(d => areaDe(d.rut) === a));
    const sel = state.rep.area === a, enGrupo = state.rep.area === OTRAS && g.grupo.get(a) === OTRAS;
    const nombre = a === SIN_AREA ? 'Sin área' : a;
    return { a, nombre, p: r.pDocs, sub: `${plural(r.trab, 'trabajador', 'trabajadores')} · ${textoTrab(r)}`, sel: sel || enGrupo,
      atenuado: state.rep.area && !sel && !enGrupo, foco: 'barea:' + a,
      i: accion(() => alternarFiltro('area', a)), etiqueta: `${a}: cumplimiento ${fmtPct(r.pDocs)}`,
      tip: `${a}\nCumplimiento: ${fmtPct(r.pDocs)} (${r.ok} de ${r.docs} documentos)\nTrabajadores aptos: ${r.aptos} de ${r.trab}\nSin documento vigente: ${r.sinVigente} · por vencer: ${r.porVencer}\n${sel ? 'Clic para quitar el filtro' : 'Clic para filtrar por esta área'}` };
  }).sort((x, y) => (x.a === SIN_AREA) - (y.a === SIN_AREA) || (y.p ?? -1) - (x.p ?? -1) || x.nombre.localeCompare(y.nombre, 'es'));
  return barrasHTML(filas);
}
function barrasPlatHTML(g){
  const docs = docsReporte(false, true, g);
  const filas = state.revisiones.map(p => {
    const r = resumir(docs.filter(d => d.plataforma_id === p.plataforma_id));
    const id = String(p.plataforma_id), sel = state.rep.plataforma === id;
    return { nombre: p.plataforma, p: r.docs ? r.pDocs : null, sub: r.docs ? `${plural(r.trab, 'trabajador', 'trabajadores')} · ${textoTrab(r)}` : 'sin trabajadores de esta área',
      sel, atenuado: state.rep.plataforma && !sel, foco: 'bplat:' + id,
      i: accion(() => alternarFiltro('plataforma', id)), etiqueta: `${p.plataforma}: cumplimiento ${fmtPct(r.pDocs)}`,
      tip: `${p.plataforma}\nCumplimiento: ${fmtPct(r.pDocs)} (${r.ok} de ${r.docs} documentos)\nTrabajadores aptos: ${r.aptos} de ${r.trab}${p.pct_doc_general !== null && p.pct_doc_general !== undefined ? `\nLa plataforma informa ${String(p.pct_doc_general).replace('.', ',')} % (puede contar otros documentos)` : ''}\nRevisada el ${fmtFecha(fechaChile(p.revisado_en))}\n${sel ? 'Clic para quitar el filtro' : 'Clic para filtrar por esta plataforma'}` };
  }).sort((x, y) => (y.p ?? -1) - (x.p ?? -1));
  return barrasHTML(filas);
}
function kpiAcreditacion(){
  const plats = state.rep.plataforma ? state.revisiones.filter(r => String(r.plataforma_id) === state.rep.plataforma) : state.revisiones;
  const conFecha = plats.filter(r => r.vigencia_acreditacion);
  if(!conFecha.length) return kpiGrande('Acreditación de Innovex', '—', 'Sin fecha en la plataforma');
  const hoy = hoyChile();
  const r = conFecha.reduce((a, b) => a.vigencia_acreditacion <= b.vigencia_acreditacion ? a : b);
  const d = diasEntre(hoy, r.vigencia_acreditacion.slice(0, 10));
  const cuando = d < 0 ? 'venció hace ' + plural(-d, 'día', 'días') : (d === 0 ? 'vence hoy' : 'en ' + plural(d, 'día', 'días'));
  const clase = d < 0 ? 'kpi-bajo' : (d <= DIAS_AVISO_ACREDITACION ? 'kpi-med' : '');
  return kpiGrande(plats.length > 1 ? 'Próxima acreditación por vencer' : 'Acreditación de Innovex', fmtFecha(r.vigencia_acreditacion), `${plats.length > 1 ? escapeHTML(r.plataforma) + ' · ' : ''}${cuando}`, clase);
}
function celdaPct(r){
  if(!r || !r.docs) return `<td class="pc"><span class="no-esta">—</span></td>`;
  return `<td class="pc c-${nivel(r.pDocs)}"><b>${fmtPct(r.pDocs)}</b><small>${r.aptos}/${r.trab} aptos</small></td>`;
}
function reporteHTML(){

  const g = gruposArea(), f = state.rep;

  const platSel = f.plataforma ? state.revisiones.find(r => String(r.plataforma_id) === f.plataforma) : null;
  const filtroTxt = [platSel ? 'Plataforma ' + platSel.plataforma : 'Todas las plataformas', f.area ? 'área ' + (f.area === OTRAS ? OTRAS + ' (' + g.otras.join(', ') + ')' : f.area) : 'todas las áreas'].join(' · ');
  const refPlat = platSel && platSel.pct_doc_general !== null && platSel.pct_doc_general !== undefined && !f.area
    ? `<br><span class="kpi-ref">La plataforma informa ${String(platSel.pct_doc_general).replace('.', ',')} % (puede contar otros documentos)</span>` : '';
  // Tabla área × plataforma, con los mismos filtros

  const ordenAreas = [...areas.keys()].sort((a, b) => (a === SIN_AREA) - (b === SIN_AREA) || areas.get(b).size - areas.get(a).size || a.localeCompare(b, 'es'));
  const fila = a => {

      ${kpiGrande('Trabajadores aptos', fmtPct(t.pAptos), `${t.aptos} de ${t.trab}${!platSel && state.revisiones.length > 1 ? ' (aptos en todas sus plataformas)' : ''}`)}

      ${kpiGrande('Sin documento vigente', t.sinVigente, 'documentos', t.sinVigente ? 'kpi-bajo' : '')}
      ${kpiGrande('Por vencer', t.porVencer, `documentos en 30 días o menos${t.enRevision ? ` · ${t.enRevision} en revisión` : ''}`, t.porVencer ? 'kpi-med' : '')}
      ${kpiAcreditacion()}

      <section class="panel"><h3>Cumplimiento por área</h3><p class="panel-sub">% de documentos vigentes${platSel ? ' en ' + escapeHTML(platSel.plataforma) : ''}. Clic para filtrar.</p>${barrasAreaHTML(g)}</section>
      ${state.revisiones.length > 1 ? `<section class="panel panel-ancho"><h3>Cumplimiento por plataforma</h3><p class="panel-sub">% de documentos vigentes${f.area ? ' del área seleccionada' : ''}. Clic para filtrar.</p>${barrasPlatHTML(g)}</section>` : ''}

    <p class="rep-sec">Por área y plataforma</p>

    ${ordenAreas.length ? `<div class="tabla-wrap"><table class="mx">

      ${ordenAreas.map(fila).join('')}
      ${ordenAreas.length > 1 ? `<tr class="tot"><td class="n">Total</td>${platsTabla.map(p => celdaPct(resumir(docs.filter(d => d.plataforma_id === p.plataforma_id)))).join('')}${platSel ? '' : celdaPct(t)}</tr>` : ''}
    </table></div>` : `<div class="empty-state">Sin trabajadores con este filtro.</div>`}
    ${areasNomina.length ? `<p class="dias-label" style="margin-top:8px;">Áreas de la nómina sin trabajadores en ${platSel ? 'esta plataforma' : 'estas plataformas'}: ${areasNomina.map(escapeHTML).join(', ')}.</p>` : ''}
    ${sinArea.length ? `<p class="rep-sec">Trabajadores en plataformas que no están en la nómina (${sinArea.length})</p>

      <div class="tabla-wrap"><table class="mx"><tr><th class="n">Trabajador</th><th>Plataformas</th></tr>
        ${sinArea.map(s => `<tr><td class="n"><b>${escapeHTML(s.nombre)}</b> <span class="rut">${fmtRut(s.rut)}</span></td><td>${escapeHTML(s.plats)}</td></tr>`).join('')}

    <p class="dias-label" style="margin-top:14px;">Fuente: última revisión de cada plataforma leída por Claude y confirmada por la persona (${state.revisiones.map(r => escapeHTML(r.plataforma) + ' ' + fmtFecha(fechaChile(r.revisado_en))).join(', ')}); nómina de Innovex${state.nomina.size ? ` (${state.nomina.size} trabajadores)` : ''}.</p>`;
}

          </div>
          <div class="account-menu-wrap">
            <button type="button" class="btn-ghost btn-sm account-menu-btn" onclick="toggleMenu()" aria-label="Menú de cuenta">☰</button>
            ${state.showAccountMenu ? `
              <div style="position:fixed;inset:0;z-index:29;" onclick="toggleMenu()"></div>
              <div class="account-menu-dropdown">
                <span class="dias-label" style="padding:6px 12px 8px;border-bottom:1px solid var(--border);margin-bottom:4px;display:block;">${escapeHTML(state.session.user.email)}</span>
                <a href="./index.html" class="account-menu-item">Cambiar de área</a>
                <button type="button" class="account-menu-item" onclick="state.showAccountMenu=false; arrancar();">Actualizar datos</button>
                <button type="button" class="account-menu-item" onclick="state.showAccountMenu=false; handleLogout();">Cerrar sesión</button>
              </div>` : ''}
          </div>
        </div>
        <div class="stats-row" id="stats-row">${statsHTML()}</div>
      </div>
      <div class="tabs-row">
        <button type="button" class="tab-item ${state.tab === 'matriz' ? 'active' : ''}" onclick="setTab('matriz')">Trabajador × plataforma</button>
        <button type="button" class="tab-item ${state.tab === 'pronto' ? 'active' : ''}" onclick="setTab('pronto')">Vence pronto</button>
        <button type="button" class="tab-item ${state.tab === 'reporte' ? 'active' : ''}" onclick="setTab('reporte')">Reporte</button>
      </div>
    </div>
    <div class="controls"><div class="controls-inner" id="controles">${controlesHTML()}</div></div>
    <div class="main">
      ${state.loadError ? `<div class="field-note" style="background:var(--st-atrasado-bg);color:var(--st-atrasado);">${escapeHTML(state.loadError)} <button type="button" class="link-btn" onclick="arrancar()">Reintentar</button></div>` : ''}
      <div class="info-banner">Los datos vienen de la última revisión de cada plataforma. Un documento renovado en la plataforma seguirá apareciendo como «por vencer» hasta la próxima revisión.</div>
      ${state.tab === 'reporte' ? '' : tarjetasHTML()}
      <div id="contenido">${contenidoHTML()}</div>
    </div>
    ${state.modal ? modalHTML() : ''}`;
}
function render(){
  const app = document.getElementById('app');
  if(!app) return;
  if(!state.session){ app.innerHTML = loginHTML(); return; }
  if(state.cargando){ app.innerHTML = '<div class="center-loading">Conectando con la base de datos…</div>'; return; }
  if(state.loadError && !state.acceso){
    app.innerHTML = `<div class="center-loading" style="flex-direction:column;gap:12px;"><p class="page-sub" style="max-width:380px;text-align:center;">${escapeHTML(state.loadError)}</p><button type="button" class="btn btn-primary" onclick="arrancar()">Reintentar</button></div>`;
    return;
  }
  if(!state.acceso){ app.innerHTML = sinAccesoHTML(); return; }
  app.innerHTML = mainHTML();
}

/* ============================================================
   INICIO
   ============================================================ */
async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  state.session = session;
  if(session){ await arrancar(); } else { state.cargando = false; render(); }
}
init();
supabaseClient.auth.onAuthStateChange((event)=>{
  if(event === 'SIGNED_OUT'){ limpiarEstado(); state.cargando = false; render(); }
});
</script>
</body>
</html>
